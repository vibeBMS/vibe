# What a crate carries beside its licence text that THIRD_PARTY_LICENSES.md
# must have, and cargo-about does not read (tools/gen_licenses.py prints it;
# about.toml has the licence texts). Every file is named here, and checked:
# a file that is gone or changed stops the generation, for a person to read
# it again.
#
# [[files.<crate>]]: a notice file of the crate (a COPYRIGHT, a third party's
# notice), or the part of one from `start` to `end` (as about.toml's clarify
# reads them), printed under the crate in the section of `license`; checksum:
# sha256 of what is printed. Read and left out: notice files that only point at
# the crate's licences (gtk-rs's, rustix's, linux-raw-sys's, the unicode-*
# crates', core-graphics's, memchr's and the other COPYING files), notices of
# code a release does not have (crossbeam-channel's LICENSE-THIRD-PARTY: its
# tests and examples; security-framework's THIRD_PARTY: its documentation),
# and credits that are no notice (crc-turbo's and ppmd-turbo's CONTRIBUTORS.md,
# ppmd-turbo's ATTRIBUTION.md: public-domain and CC0 sources).
#
# [[upstream]]: a crate that ships no licence file, whose repository has one
# with its holders: that file at the commit each version was published from
# (its .cargo_vcs_info.json), by its checksum, and its notices printed under
# the crate. Each names the versions it is for: a new version stops the
# generation until someone reads the file at that version's commit.

# its only notice file is the Rust project's COPYRIGHT (its UTF-8 code comes from
# Rust's standard library); the rest of that file is about other parts of Rust
[[files.cesu8]]
path = "COPYRIGHT-RUST.txt"
license = "Apache-2.0"
start = "The Rust Project is copyright 2014"
end = "according to those terms."
checksum = "7c48423c173554d2f21378bda00dd7ad7a078c02d598d0dead0926823bed7965"

