# An X server without a screen for the comparison (xserver.sh): the dummy
# driver at 1280x720, Mesa's software OpenGL. The mode is named plainly
# "1280x720" and has a refresh rate: LWJGL 2 (beatoraja's) reads the modes
# from xrandr's output and finds none in a name like "1280x720_60" or in
# Xvfb's 0 Hz mode.
Section "Device"
  Identifier "dummy"
  Driver "dummy"
  VideoRam 256000
EndSection
Section "Monitor"
  Identifier "monitor"
  HorizSync 5.0-1000.0
  VertRefresh 5.0-200.0
  Modeline "1280x720" 74.25 1280 1390 1430 1650 720 725 730 750 +HSync +VSync
EndSection
Section "Screen"
  Identifier "screen"
  Device "dummy"
  Monitor "monitor"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "1280x720"
    Virtual 1280 720
  EndSubSection
EndSection
