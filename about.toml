# cargo-about's configuration for THIRD_PARTY_LICENSES.md (tools/gen_licenses.sh
# makes it; docs/BUILDING.md, "Development").
#
# Every licence a shipped crate is used under is named here, in the order
# they are chosen for a crate that offers several (`MIT OR Apache-2.0` is
# taken as Apache-2.0: one text for most crates): a crate under any other
# licence stops the generation, for a person to read that licence first.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "bzip2-1.0.6",
]

# what the releases are built for (tools/build_release.sh): the crates any of
# them links
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-linux-android",
    "x86_64-linux-android",
    "wasm32-unknown-unknown",
]

# Tests' crates are not shipped. Build scripts' and proc-macros' crates are
# kept: some put their own code or data into the program (lua-src's Lua
# sources, khronos_api's registry through gl_generator, the derives' output),
# and the rest cost a few lines.
ignore-dev-dependencies = true
# (this workspace's crates are vibeBMS itself: tools/gen_licenses.py leaves
# them out)
private = { ignore = true }

# ring declares `Apache-2.0 AND ISC` and keeps the texts in two files (LICENSE
# says which code each covers); without this its source files' headers are
# taken for licence files, one text per header
[ring.clarify]
license = "Apache-2.0 AND ISC"

[[ring.clarify.files]]
path = "LICENSE-BoringSSL"
license = "Apache-2.0"
checksum = "005fc765ddc5115da796cca915baa9557abae13ff35e0a47c47affc56f6c414d"

[[ring.clarify.files]]
path = "LICENSE-other-bits"
license = "ISC"
checksum = "f025ccfb7dfb6bdfedc75ca0f67acc69e6fb4998143d834f7c2f38a29989680f"

# unrar-rs has a licence file and no expression: Apache-2.0 with the UnRAR
# condition on its RAR engine, which the file states before the Apache text
# (the whole file is kept, as it asks)
[unrar-rs.clarify]
license = "Apache-2.0"

[[unrar-rs.clarify.files]]
path = "LICENSE"
checksum = "97dfd1950dfb0901afbf6e51cae496e12281e97f670fdb2a2aab3252d2561086"
