[package]
name = "vibebms-core"
description = "BMS/BMSON parsing, timing, judge, gauge and scoring engine for vibeBMS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
md-5.workspace = true
sha2.workspace = true
encoding_rs.workspace = true
flate2 = "1"

[features]
# the test bot (`bot`) for the app's tests
testing = []

[dev-dependencies]
# (its integration tests use the bot too)
vibebms-core = { path = ".", features = ["testing"] }
