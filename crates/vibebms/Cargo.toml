[package]
name = "vibebms"
description = "Cross-platform, native, high performance BMS player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vibebms_app"
path = "src/lib.rs"

[[bin]]
name = "vibebms"
path = "src/main.rs"

[features]
default = ["browser"]
# the in-app browser that downloads songs (desktop; on Linux it needs
# WebKitGTK: libwebkit2gtk-4.1-dev)
browser = ["dep:wry", "dep:gtk"]
asio = ["vibebms-audio/asio"]
jack = ["vibebms-audio/jack"]

[dependencies]
encoding_rs.workspace = true
vibebms-core.workspace = true
bmseeker.workspace = true
vibebms-ir.workspace = true
vibebms-audio.workspace = true
serde.workspace = true
include_dir = "0.7"
serde_json.workspace = true
log.workspace = true
sha2.workspace = true
winit = { version = "0.30", features = ["serde"] }
wgpu = { version = "24", features = ["webgl"] }
bytemuck = { version = "1", features = ["derive"] }
fontdue = "0.9"
fontdb = "0.24"
# the characters of a fallback font before fontdue parses it (the version fontdue reads with)
ttf-parser = { version = "0.25", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tga"] }
web-time = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
ehttp = { version = "0.7", features = ["streaming"] }
# (preserve_order: `Config::to_toml` writes the keys in their order)
toml = { version = "1", features = ["preserve_order"] }
json5 = "1"
flate2 = "1"
# download pages of charts a difficulty table lists but the library lacks
webbrowser = "1"

# Desktop: trust the OS certificate store (corporate proxies, custom CAs).
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
ehttp = { version = "0.7", features = ["platform-verifier"] }
rfd = "0.18"
wry = { version = "0.57", optional = true }
# the self-update replaces the running executable (Windows: renamed away)
self-replace = "1.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
gilrs = "0.11"

[target.'cfg(target_os = "ios")'.dependencies]
wry = { version = "0.57", optional = true }
# IR keys in the Keychain (ir/creds.rs)
security-framework = "3"


# the download browser (Java, platform/android) through JNI
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
# beatoraja Lua skins (Lua is compiled from source)
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# beatoraja Lua skins: Lua is compiled by vibebms-lua-web (clang), mlua
# links to it
mlua = { version = "0.12", features = ["lua54", "serialize"] }
mlua-sys = { version = "0.13", features = ["external"] }
vibebms-lua-web = { path = "../vibebms-lua-web" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement", "File", "FileList", "Blob", "Storage", "DomRect", "Screen", "Navigator", "Location", "Event", "AddEventListenerOptions", "EventTarget", "Performance", "TouchEvent", "TouchList", "Touch", "Worker", "MessageEvent", "Blob", "BlobPropertyBag", "Url"] }

[dev-dependencies]
# archives for tests
bmseeker = { workspace = true, features = ["testkit"] }
