[package]
name = "vibebms"
description = "Cross-platform, native, high performance BMS player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vibebms_app"
path = "src/lib.rs"

[[bin]]
name = "vibebms"
path = "src/main.rs"

[features]
default = []
asio = ["vibebms-audio/asio"]

[dependencies]
vibebms-core.workspace = true
vibebms-tables.workspace = true
vibebms-ir.workspace = true
vibebms-audio.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
winit = { version = "0.30", features = ["serde"] }
wgpu = { version = "24", features = ["webgl"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
fontdue = "0.9"
fontdb = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
web-time = "1"
ehttp = "0.7"
toml = "0.8"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

# Desktop: trust the OS certificate store (corporate proxies, custom CAs).
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
ehttp = { version = "0.7", features = ["platform-verifier"] }
rfd = "0.18"

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
gilrs = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement", "File", "FileList", "Blob", "Storage"] }
