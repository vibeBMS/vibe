[package]
name = "vibebms"
description = "Cross-platform, native, high performance BMS player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vibebms_app"
path = "src/lib.rs"

[[bin]]
name = "vibebms"
path = "src/main.rs"

[features]
default = ["browser"]
# the in-app browser that downloads songs (desktop; on Linux it needs
# WebKitGTK: libwebkit2gtk-4.1-dev)
browser = ["dep:wry", "dep:gtk"]
asio = ["vibebms-audio/asio"]
jack = ["vibebms-audio/jack"]

[dependencies]
encoding_rs.workspace = true
vibebms-core.workspace = true
bmseeker.workspace = true
vibebms-ir.workspace = true
vibebms-audio.workspace = true
serde.workspace = true
include_dir = "0.7"
serde_json.workspace = true
log.workspace = true
sha2.workspace = true
winit = { version = "0.30", features = ["serde"] }
wgpu = { version = "24", features = ["webgl"] }
bytemuck = { version = "1", features = ["derive"] }
fontdb = "0.24"
# glyphs read from font files as they are drawn (gfx/font.rs; the version fontdb reads with)
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
ab_glyph_rasterizer = "0.1"
# system fonts mapped, not read into memory
memmap2 = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tga", "webp"] }
web-time = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
ehttp = { version = "0.7", features = ["streaming"] }
# (preserve_order: `Config::to_toml` writes the keys in their order)
toml = { version = "1", features = ["preserve_order"] }
json5 = "1"
flate2 = "1"
# the translation tables' hash (the version mlua builds with)
rustc-hash = "2"
# a zip's files read where they are (charts in archives: platform/arcfs.rs;
# the version and features BMSeeker unpacks with)
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
# download pages of charts a difficulty table lists but the library lacks
webbrowser = "1"

# Desktop: trust the OS certificate store (corporate proxies, custom CAs).
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
ehttp = { version = "0.7", features = ["platform-verifier"] }
rfd = "0.18"
wry = { version = "0.57", optional = true }
# the self-update replaces the running executable (Windows: renamed away)
self-replace = "1.5"
# the integrations' WebSocket keys, masks and OBS authentication (the
# versions and features ureq and zip build)
base64 = { version = "0.23", default-features = false, features = ["std"] }
getrandom = { version = "0.4", default-features = false }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
gilrs = "0.11"

[target.'cfg(target_os = "ios")'.dependencies]
wry = { version = "0.57", optional = true }
# IR keys in the Keychain (ir/creds.rs)
security-framework = "3"
# input events' own times, the hardware keyboard (platform/ios.rs)
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSEnumerator", "NSSet"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIEvent", "UITouch"] }
objc2-game-controller = { version = "0.3", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-foundation", "GCControllerButtonInput", "GCControllerElement", "GCDevice", "GCKeyCodes", "GCKeyboard", "GCKeyboardInput", "GCPhysicalInputProfile"] }
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }


# the download browser (Java, platform/android) through JNI
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
# the system's language (the UI's when LANGUAGE is AUTO; web: navigator.language)
sys-locale = "0.3"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
# beatoraja Lua skins (Lua is compiled from source)
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# beatoraja Lua skins: Lua is compiled by vibebms-lua-web (clang), mlua
# links to it
mlua = { version = "0.12", features = ["lua54", "serialize"] }
mlua-sys = { version = "0.13", features = ["external"] }
vibebms-lua-web = { path = "../vibebms-lua-web" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement", "File", "FileList", "Blob", "Storage", "DomRect", "Screen", "Navigator", "Location", "Event", "AddEventListenerOptions", "EventTarget", "Performance", "TouchEvent", "TouchList", "Touch", "Worker", "MessageEvent", "Blob", "BlobPropertyBag", "Url"] }

[dev-dependencies]
# glyphs drawn as fontdue drew them (gfx/text.rs tests)
fontdue = "0.9"
# archives for tests
bmseeker = { workspace = true, features = ["testkit"] }
# 7z archives made for tests (the version BMSeeker reads)
sevenz-rust2 = { version = "0.25", default-features = false, features = ["compress"] }
# animated PNG and WebP fixtures for the image tests (the versions image uses)
png = "0.18"
image-webp = "0.2"
# the test bot
vibebms-core = { workspace = true, features = ["testing"] }
