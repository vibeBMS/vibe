[package]
name = "bmseeker"
description = "BMS library tools: difficulty tables, downloads from where authors link songs, unpacking, and putting charts into their songs' folders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "bmseeker"
path = "src/lib.rs"

[[bin]]
name = "bmseeker"
path = "src/main.rs"

[dependencies]
vibebms-core.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
encoding_rs.workspace = true
md-5.workspace = true
sha2.workspace = true
url = "2"
web-time = "1"
ehttp = { version = "0.7", features = ["streaming"] }
# archives (.zip; .7z; .rar: Apache-2.0 with the UnRAR license restriction)
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["bzip2", "ppmd"] }
unrar-rs = { version = "0.16", default-features = false, features = ["crypto-rust"] }
# MEGA files are AES-128-CTR encrypted
aes = "0.9"

# Desktop: trust the OS certificate store (corporate proxies, custom CAs).
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
ehttp = { version = "0.7", features = ["platform-verifier"] }
