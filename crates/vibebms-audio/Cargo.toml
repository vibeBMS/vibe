[package]
name = "vibebms-audio"
description = "Low latency keysound mixer and decoder for vibeBMS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Windows ASIO output (requires the ASIO SDK at build time, see cpal docs)
asio = ["cpal/asio"]
# Linux JACK output
jack = ["cpal/jack"]

[dependencies]
cpal = "0.18"
# the formats BMS keysounds come in (not symphonia's default Matroska)
symphonia = { version = "0.6", default-features = false, features = ["adpcm", "flac", "mp3", "ogg", "pcm", "vorbis", "wav"] }
log.workspace = true
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.18", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AudioContext", "BaseAudioContext", "AudioNode", "AudioDestinationNode", "AudioWorklet", "Worklet", "AudioWorkletNode", "AudioWorkletNodeOptions", "MessagePort", "MessageEvent", "Blob", "BlobPropertyBag", "Url", "Window", "Performance"] }

# iOS: the audio session (cpal leaves it as it is)
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

# Windows: WASAPI output of its own (exclusive mode, IAudioClient3 periods)
[target.'cfg(windows)'.dependencies]
wasapi = "0.27"
windows = { version = "0.62", features = ["Win32_System_Threading"] }
