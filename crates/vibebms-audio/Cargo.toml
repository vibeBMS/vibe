[package]
name = "vibebms-audio"
description = "Low latency keysound mixer and decoder for vibeBMS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Windows ASIO output (requires the ASIO SDK at build time, see cpal docs)
asio = ["cpal/asio"]
# Linux JACK output
jack = ["cpal/jack"]

[dependencies]
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3"] }
log.workspace = true
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.15", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AudioContext", "BaseAudioContext", "AudioNode", "AudioDestinationNode", "AudioWorklet", "Worklet", "AudioWorkletNode", "AudioWorkletNodeOptions", "MessagePort", "MessageEvent", "Blob", "BlobPropertyBag", "Url", "Window", "Performance"] }

# iOS: the audio session (cpal leaves it as it is)
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
