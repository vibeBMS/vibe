[package]
name = "vibebms-android"
description = "Android packaging for vibeBMS (NativeActivity)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
vibebms = { path = "../vibebms" }
winit = { version = "0.30", features = ["android-native-activity"] }
log.workspace = true
android_logger = "0.14"

# `cargo apk build -p vibebms-android --release` (see docs/BUILDING.md)
[package.metadata.android]
package = "io.github.vibebms"
apk_name = "vibeBMS"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "vibeBMS"
has_code = false

[package.metadata.android.application.activity]
orientation = "unspecified"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|navigation|uiMode"
launch_mode = "singleTask"

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen.multitouch.distinct"
required = false
