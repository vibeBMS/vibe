[package]
name = "bmseeker-gui"
description = "bmseeker with a window: difficulty tables, the songs the library lacks, downloads, charts waiting for their song, exports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bmseeker-gui"
path = "src/main.rs"

[dependencies]
bmseeker.workspace = true
serde.workspace = true
serde_json.workspace = true
md-5.workspace = true
sha2.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# a font with Japanese / Korean from the system (egui's own have none)
fontdb = "0.16"
rfd = "0.18"
