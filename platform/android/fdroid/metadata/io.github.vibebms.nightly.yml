# The F-Droid repository's metadata for the nightly app (read by
# tools/fdroid_repo.sh; the icon is io.github.vibebms.nightly/en-US/icon.png,
# a copy of assets/logo/icon-512.png). Each channel is its own app id
# (tools/ci_version.sh), so a stable channel gets a file of its own.
