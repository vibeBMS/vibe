[workspace]
resolver = "2"
members = [
    "crates/vibebms-core",
    "crates/vibebms-ir",
    "crates/vibebms-audio",
    "crates/vibebms",
    "crates/vibebms-android",
    "crates/vibebms-web",
    "crates/vibebms-lua-web",
]
default-members = ["crates/vibebms"]
# (a dependency's copy, not the workspace's: vendor/lua-src/Cargo.toml)
exclude = ["vendor/lua-src"]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/vibeBMS/vibe"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
vibebms-core = { path = "crates/vibebms-core" }
# BMS library tools (difficulty tables, downloads, placement): its own repository
bmseeker = { git = "https://github.com/vibeBMS/BMSeeker" }
vibebms-ir = { path = "crates/vibebms-ir" }
vibebms-audio = { path = "crates/vibebms-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
md-5 = "0.10"
sha2 = "0.10"
encoding_rs = "0.8"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# line numbers in backtraces, no variables for a debugger: links faster and
# keeps target/ smaller (debug = true when a debugger needs them)
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# Web build (tools/build_web.sh): keep the wasm target-features section.
[profile.web]
inherits = "release"
strip = false
lto = "thin"

# Lua's sources compiled in name order, for reproducible builds
# (vendor/lua-src/Cargo.toml says why)
[patch.crates-io]
lua-src = { path = "vendor/lua-src" }
