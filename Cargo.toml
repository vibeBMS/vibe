[workspace]
resolver = "2"
members = [
    "crates/vibebms-core",
    "crates/vibebms-tables",
    "crates/vibebms-ir",
    "crates/vibebms-audio",
    "crates/vibebms",
    "crates/vibebms-android",
    "crates/vibebms-web",
]
default-members = ["crates/vibebms"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/vibeBMS/vibe"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
vibebms-core = { path = "crates/vibebms-core" }
vibebms-tables = { path = "crates/vibebms-tables" }
vibebms-ir = { path = "crates/vibebms-ir" }
vibebms-audio = { path = "crates/vibebms-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
md-5 = "0.10"
sha2 = "0.10"
encoding_rs = "0.8"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

# Web build (tools/build_web.sh): keep the wasm target-features section.
[profile.web]
inherits = "release"
strip = false
lto = "thin"
