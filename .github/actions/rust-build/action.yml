name: build vibeBMS
description: >-
  The release executable for one target, stamped with the CI version, as the
  artifact vibeBMS-<name>.

inputs:
  name:
    description: Artifact suffix, e.g. linux-x64 (tools/build_release.sh's artifact)
    required: true
  target:
    description: Rust target triple
    required: true
  cache-key:
    description: rust-cache key (the target and the runner image)
    required: true
  cache-job:
    description: The job named in the cache key (rust-setup's cache-job)
    default: ""

runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust-setup
      with:
        targets: ${{ inputs.target }}
        # the runner image too: a build cached on another image (ubuntu-24.04
        # before 22.04) restored as fresh but without its crates' files
        cache-key: ${{ inputs.cache-key }}
        cache-job: ${{ inputs.cache-job }}
    # as tools/reproduce.sh and the Reproducible builds workflow build it
    - run: tools/build_release.sh ${{ inputs.name }}
      shell: bash
    # the executable alone (the downloads job links it in the run summary)
    - uses: actions/upload-artifact@v7
      with:
        name: vibeBMS-${{ inputs.name }}
        path: |
          target/${{ inputs.target }}/release/vibebms
          target/${{ inputs.target }}/release/vibebms.exe
