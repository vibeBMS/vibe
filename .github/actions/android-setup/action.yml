name: Android setup
description: >-
  The pinned Android build tools of tools/repro.env: the NDK (ANDROID_NDK_HOME),
  cargo-ndk and, for the APK, the JDK, Gradle, the build-tools (apksigner,
  zipalign) and apksigcopier (tools/apksigcopier.txt).

inputs:
  path:
    description: The repository's folder (its tools/repro.env)
    default: "."
  tools:
    description: >-
      apk: all of them (the APK's build); ndk: the NDK and cargo-ndk alone
      (compiling the Rust library); sign: the JDK, the build-tools and
      apksigcopier alone (signing an APK: nothing that compiles or builds)
    default: apk

runs:
  using: composite
  steps:
    - id: pins
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        . tools/repro.env
        echo "java=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
        echo "gradle=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"
    - if: inputs.tools != 'sign'
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        . tools/repro.env
        # the runner image has a few NDKs, and its "latest" moves on: this one,
        # installed if the image lacks it
        ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
        if [ ! -d "$ndk" ]; then
          echo "installing NDK $NDK_VERSION"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
        fi
        echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
        cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"
    # apksigner (which signs the APK) and zipalign of the pinned build-tools,
    # and apksigcopier (pinned by SHA-256), which checks that the release's
    # signature copied onto the unsigned APK gives the signed one
    - if: inputs.tools != 'ndk'
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        . tools/repro.env
        if [ ! -x "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" ]; then
          echo "installing build-tools $BUILD_TOOLS_VERSION"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS_VERSION" > /dev/null
        fi
        # (only its command on PATH, not the venv's python)
        python3 -m venv "$RUNNER_TEMP/apksigcopier"
        "$RUNNER_TEMP/apksigcopier/bin/pip" install -q --require-hashes --only-binary :all: -r tools/apksigcopier.txt
        mkdir -p "$RUNNER_TEMP/apksigcopier/path"
        ln -sf ../bin/apksigcopier "$RUNNER_TEMP/apksigcopier/path/apksigcopier"
        echo "$RUNNER_TEMP/apksigcopier/path" >> "$GITHUB_PATH"
    - if: inputs.tools != 'ndk'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ steps.pins.outputs.java }}
    # Gradle's caches as one entry: the dependencies and the distribution
    # (the large parts), not setup-gradle's many small entries
    - if: inputs.tools == 'apk'
      uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper/dists
          ~/gradle-installations
        key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.gradle }}-${{ hashFiles(format('{0}/platform/android/**/*.gradle.kts', inputs.path), format('{0}/platform/android/gradle.properties', inputs.path)) }}
        restore-keys: gradle-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.gradle }}-
    - if: inputs.tools == 'apk'
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: ${{ steps.pins.outputs.gradle }}
        cache-disabled: true
