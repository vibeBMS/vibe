name: Rust setup
description: >-
  The toolchain rust-toolchain.toml names with the given targets and
  components, the build cache, and (for a build) the CI version stamped into
  Cargo.toml.

inputs:
  targets:
    description: Extra targets, comma separated
    default: ""
  components:
    description: Extra components, comma separated
    default: ""
  cache-key:
    description: rust-cache key (empty for the job's default)
    default: ""
  stamp:
    description: "true: stamp the CI version (tools/ci_version.sh)"
    default: "true"

runs:
  using: composite
  steps:
    # an exact release, so a build can be made again with the same compiler
    # (docs/BUILDING.md, "Reproducible builds")
    - id: toolchain
      shell: bash
      run: |
        channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
        [ -n "$channel" ] || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (the action's branch; the toolchain is its input)
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}
        # only the default branch writes the cache (pull requests and other
        # branches read its entries): the repository's 10 GB cache is about
        # one set of these, and each pull request's set evicted the default
        # branch's
        save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    # CI builds are <version>-nightly.<run>+<commit> (after the cache step,
    # whose key reads Cargo.toml)
    - if: inputs.stamp == 'true'
      run: ./tools/ci_version.sh
      shell: bash
