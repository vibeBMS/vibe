name: apt install
description: >-
  Install Ubuntu packages from one fast mirror, with the downloaded packages
  kept in the Actions cache.

inputs:
  packages:
    description: Packages to install, separated by spaces
    required: true
  packages-without-recommends:
    description: >-
      Packages to install without their Recommends, after `packages` (which
      get theirs), separated by spaces
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The hosted x64 images list several mirrors and apt may settle on a slow
    # one; Azure's, next to the runners, comes first, and the main archive
    # after it for when Azure's does not answer (apt's mirror list tries the
    # next one). (arm64 images use ports.ubuntu.com, which Azure does not
    # mirror: left as is.)
    - name: pin the mirror
      shell: bash
      run: |
        f=/etc/apt/apt-mirrors.txt
        if [ "$(dpkg --print-architecture)" = amd64 ] && [ -f "$f" ]; then
          # Azure's only while it answers (a mirror that does not would make
          # apt wait out its timeouts on every file before the next)
          azure=http://azure.archive.ubuntu.com/ubuntu/
          if curl -fsS -m 5 -o /dev/null "${azure}dists/"; then
            printf '%s\n' "$azure" http://archive.ubuntu.com/ubuntu/ | sudo tee "$f" >/dev/null
          else
            echo "::warning::$azure does not answer: the main archive instead"
            echo http://archive.ubuntu.com/ubuntu/ | sudo tee "$f" >/dev/null
          fi
        fi
        echo "APT_ARCHIVES=$RUNNER_TEMP/apt-archives" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/apt-archives/partial"
    # (the key names the package set; a newer version of a package is simply
    # downloaded in addition)
    - uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/apt-archives
        key: apt-${{ runner.os }}-${{ runner.arch }}-${{ inputs.packages }}${{ inputs.packages-without-recommends && format('-norec-{0}', inputs.packages-without-recommends) || '' }}
    - name: install
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        NOREC: ${{ inputs.packages-without-recommends }}
      run: |
        # (a short connect timeout: a mirror that does not answer is left for
        # the next one at once)
        opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o "Dir::Cache::Archives=$APT_ARCHIVES"
          -o APT::Keep-Downloaded-Packages=true)
        sudo apt-get "${opts[@]}" update
        # shellcheck disable=SC2086
        sudo apt-get "${opts[@]}" install -y $PACKAGES
        if [ -n "$NOREC" ]; then
          # shellcheck disable=SC2086
          sudo apt-get "${opts[@]}" install -y --no-install-recommends $NOREC
        fi
        # apt leaves root-owned files: make them readable for the cache
        sudo chown -R "$(id -u):$(id -g)" "$APT_ARCHIVES"
        rm -f "$APT_ARCHIVES/lock"
