name: Cache prune

# Only the default branch's newest cache of each job stays: other refs'
# entries and the default branch's older ones (left when Cargo.lock, the
# toolchain or go.sum changed) are deleted, so the repository's 10 GB hold one
# set. It runs after each CI run, also a cancelled one (a newer
# push cancels the older run, whose last jobs would never prune), and daily.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: cache-prune
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          main="refs/heads/$(gh api "repos/$GH_REPO" --jq .default_branch)"
          # rust-cache: v0-rust-<key>-<job>-<os>-<arch>-<environment>-<lockfiles>;
          # setup-go: setup-go-<os>-<arch>-<image>-go-<version>-<go.sum hash>;
          # any other key: only other refs' entries
          gh cache list --limit 1000 --sort created_at --order desc \
            --json id,key,ref,sizeInBytes --jq '.[] | "\(.id)\t\(.key)\t\(.ref)\t\(.sizeInBytes)"' |
            awk -F'\t' -v main="$main" '{
              job = $2
              if (job ~ /^v0-rust-/) sub(/-[0-9a-f]+-[0-9a-f]+$/, "", job)
              else if (job ~ /^setup-go-/) sub(/-[0-9a-f]+$/, "", job)
              if ($3 != main || (job != $2 && seen[job]++)) print $1 "\t" $2 "\t" $3 "\t" int($4 / 1048576) " MB"
            }' |
            while IFS=$'\t' read -r id key ref size; do
              echo "delete $key ($ref, $size)"
              gh cache delete "$id"
            done
