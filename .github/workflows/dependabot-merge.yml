name: Dependabot merge

# Merges a Dependabot pull request once CI has passed on its head commit,
# unless it changes a dependency's major version. Those wait for a person:
# CI cannot check everything a new major may change (behaviour on devices,
# licences and terms). Major follows Cargo: the first part of the old version
# that is not 0, so 0.6 -> 0.8 is a major change, though Dependabot calls it
# a minor update. A new Rust release (rust-toolchain.toml, 1.x) is a minor
# update: it changes the release builds' bytes, which a commit of its own
# allows, and CI builds and tests with it.
# (A Toolchain pins pull request is merged by its own workflow,
# toolchain-pins.yml: the CI run it starts gives no workflow_run event.)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # (a CI run of any other branch starts no run of this workflow)
    branches: ["dependabot/**"]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Dependabot's own pull request from a branch of this repository,
          # at a commit Dependabot made and GitHub signed: the run's actor
          # alone does not say whose branch and commits these are
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open \
            --json number,headRefOid,isCrossRepository,author |
            jq -r --arg sha "$SHA" '.[] | select(.headRefOid == $sha and (.isCrossRepository | not)
              and (.author.login | test("^(app/)?dependabot(\\[bot\\])?$"))) | .number')
          if [ -z "$pr" ]; then echo "no open pull request of Dependabot's at $SHA"; exit 0; fi
          gh api "repos/$REPO/commits/$SHA" > "$RUNNER_TEMP/commit.json"
          if ! jq -e '.commit.verification.verified and .author.login == "dependabot[bot]"' \
            "$RUNNER_TEMP/commit.json" > /dev/null; then
            echo "#$pr: $SHA is not a signed commit of Dependabot's; left for review"
            exit 0
          fi
          jq -r .commit.message "$RUNNER_TEMP/commit.json" > "$RUNNER_TEMP/msg"
          cat > "$RUNNER_TEMP/held.py" <<'EOF'
          import re, sys
          # Each update Dependabot lists, "Updates `x` from A to B" or
          # "Bumps [x](...) from A to B.", is held when it changes A's major:
          # its first part other than 0, as Cargo reads 0.x versions.
          # A git dependency or an action pinned by commit moves from one commit
          # to another ("from `09fbb4f` to `9a5b111`"): a commit has no major to
          # read, so it is held too, but for the project's own repository.
          OWN = {"bmseeker"}
          msg = sys.stdin.read()
          ups = re.findall(r"(?:Updates `([^`]+)`|Bumps \[([^\]]+)\]\([^)]*\)) from `?v?(\S+?)`? to `?v?(\S+?)`?\.?$", msg, re.M)
          if not ups:
              print("no updates found in the commit message")
          def commit(v):
              return re.fullmatch(r"[0-9a-f]{7,40}", v) is not None
          def parts(v):
              n = [int(x) for x in re.findall(r"\d+", v.split("+")[0].split("-")[0])[:3]]
              return n + [0] * (3 - len(n))
          for a, b, old, new in ups:
              name = a or b
              if commit(old) or commit(new):
                  if not (name in OWN and commit(old) and commit(new)):
                      print(f"{name} {old} -> {new} (a commit, not a version)")
                  continue
              o, n = parts(old), parts(new)
              i = next((k for k, v in enumerate(o) if v), 2)
              if o[: i + 1] != n[: i + 1] or n < o:
                  print(f"{name} {old} -> {new}")
          EOF
          held=$(python3 -I "$RUNNER_TEMP/held.py" < "$RUNNER_TEMP/msg")
          if [ -n "$held" ] || grep -q "update-type: version-update:semver-major" "$RUNNER_TEMP/msg"; then
            echo "#$pr left for review:"
            echo "${held:-a major update}"
            exit 0
          fi
          gh pr merge -R "$REPO" "$pr" --squash --delete-branch --match-head-commit "$SHA"

