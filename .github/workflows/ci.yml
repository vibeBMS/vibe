name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (lint + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, os: windows-latest, target: aarch64-pc-windows-msvc }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release -p vibebms --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir -p dist/vibeBMS
          cp README.md dist/vibeBMS/
          cp -r docs dist/vibeBMS/
          if [ -f target/${{ matrix.target }}/release/vibebms.exe ]; then
            cp target/${{ matrix.target }}/release/vibebms.exe dist/vibeBMS/
          else
            cp target/${{ matrix.target }}/release/vibebms dist/vibeBMS/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vibeBMS-${{ matrix.name }}
          path: dist/vibeBMS

  web:
    name: build web (wasm32)
    needs: test
    runs-on: ubuntu-latest
    # pushes publish the build to the gh-pages branch (GitHub Pages)
    permissions:
      contents: write
    concurrency:
      group: web-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install wasm-bindgen-cli --locked --version "$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | cut -d'"' -f2)"
      - run: ./tools/build_web.sh
      - name: demo song (the page's "Demo song" button)
        run: |
          python3 tools/gen_demo.py "$RUNNER_TEMP/demo/vibeBMS demo"
          (cd "$RUNNER_TEMP/demo" && zip -qr "$GITHUB_WORKSPACE/web/demo.zip" "vibeBMS demo")
      - uses: actions/upload-artifact@v4
        with:
          name: vibeBMS-web
          path: web
      # default branch -> the site root, other branches -> preview/<branch>/
      - name: where to publish
        if: github.event_name == 'push'
        id: dest
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "${{ github.event.repository.default_branch }}" ]; then
            dir=""
          else
            dir="preview/$(echo "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._\n-' '-')"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "url=https://${owner}.github.io/${repo}/${dir:+$dir/}" >> "$GITHUB_OUTPUT"
      - name: publish to gh-pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          destination_dir: ${{ steps.dest.outputs.dir }}
          keep_files: true
          commit_message: "web build ${{ github.sha }} (${{ github.ref_name }})"
      - name: link
        if: github.event_name == 'push'
        run: |
          echo "### Web build" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.dest.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "(needs GitHub Pages: Settings > Pages > Deploy from a branch > gh-pages / root)" >> "$GITHUB_STEP_SUMMARY"

  # an unsigned .ipa: install it by signing it with your own Apple ID
  # (AltStore, Sideloadly) or a developer certificate
  ios:
    name: build iOS (unsigned, experimental)
    needs: test
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: aarch64-apple-ios
      - run: cargo build --release -p vibebms --target aarch64-apple-ios
      - name: package
        run: |
          app=Payload/vibeBMS.app
          mkdir -p "$app"
          cp target/aarch64-apple-ios/release/vibebms "$app/"
          cp platform/ios/Info.plist platform/ios/*.png "$app/"
          zip -qr vibeBMS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: vibeBMS-ios-unsigned
          path: vibeBMS-unsigned.ipa

  android:
    name: build android (experimental)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-apk --locked
      # release APKs must be signed: with the repository's key when its
      # secrets hold one (base64 keystore + password), else a throwaway key
      # (the APK installs, but cannot update one signed by another key)
      - name: signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            pass="$KEYSTORE_PASSWORD"
          else
            pass="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$ks" -storepass "$pass" -keypass "$pass" -alias vibebms \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=vibeBMS"
          fi
          echo "::add-mask::$pass"
          echo "CARGO_APK_RELEASE_KEYSTORE=$ks" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"
      - run: ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" cargo apk build -p vibebms-android --release
      - uses: actions/upload-artifact@v4
        with:
          name: vibeBMS-android
          path: target/release/apk/*.apk
