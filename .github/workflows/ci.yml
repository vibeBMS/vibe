name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (lint + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # lint the code other targets compile (cfg'd out on Linux) in minutes,
  # before the release builds; iOS needs a Mac: its build job covers it
  cross-check:
    name: cross-check (wasm32, android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown,aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cross-check
      # Lua is compiled from C for the web: clang with the WebAssembly target
      - run: clang --version
      # the runner may have only versioned llvm-ar-NN
      - run: echo "AR_wasm32_unknown_unknown=$(command -v llvm-ar || ls /usr/bin/llvm-ar-* | sort -V | tail -1)" >> "$GITHUB_ENV"
      - run: cargo clippy -p vibebms -p vibebms-web -p vibebms-lua-web --lib --target wasm32-unknown-unknown -- -D warnings
      - run: cargo install cargo-ndk --locked
      - run: >-
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a clippy -p vibebms -p vibebms-android -- -D warnings

  build:
    name: build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: the oldest runner with WebKitGTK 4.1 (glibc 2.35: Ubuntu
          # 22.04, Debian 12 and newer); `build-linux-portable` has the rest
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, os: windows-latest, target: aarch64-pc-windows-msvc }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # the runner image too: a build cached on another image (ubuntu-24.04
          # before 22.04) restored as fresh but without its crates' files
          key: ${{ matrix.target }}-${{ matrix.os }}
      # CI builds are <version>-nightly.<run>+<commit> (after the cache step,
      # whose key reads Cargo.toml)
      - run: ./tools/ci_version.sh
        shell: bash
      - run: cargo build --release -p vibebms --target ${{ matrix.target }}
      # the version it was built with, for the nightly's latest.json
      - run: echo "$VIBEBMS_VERSION" > target/${{ matrix.target }}/release/version.txt
        shell: bash
      # the executable alone (the downloads job links it in the run summary)
      - uses: actions/upload-artifact@v4
        with:
          name: vibeBMS-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/vibebms
            target/${{ matrix.target }}/release/vibebms.exe
            target/${{ matrix.target }}/release/version.txt

  # Linux without the download browser (no WebKitGTK / GTK), built against
  # glibc 2.28 in a manylinux_2_28 (AlmaLinux 8) container: it starts on
  # older and more distributions (RHEL 8, Debian 10, Ubuntu 20.04) and needs
  # only ALSA and libudev
  build-linux-portable:
    name: build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-portable, os: ubuntu-latest, image: "quay.io/pypa/manylinux_2_28_x86_64", target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64-portable, os: ubuntu-24.04-arm, image: "quay.io/pypa/manylinux_2_28_aarch64", target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - run: dnf install -y alsa-lib-devel systemd-devel pkgconf-pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}
      # CI builds are <version>-nightly.<run>+<commit> (after the cache step,
      # whose key reads Cargo.toml)
      - run: ./tools/ci_version.sh
        shell: bash
      - run: cargo build --release -p vibebms --no-default-features --target ${{ matrix.target }}
      - name: needs glibc 2.28 at most
        run: |
          v=$(objdump -T target/${{ matrix.target }}/release/vibebms | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "newest glibc symbol: $v"
          [ "$(printf '%s\nGLIBC_2.28\n' "$v" | sort -V | tail -1)" = "GLIBC_2.28" ]
      # the version it was built with, for the nightly's latest.json
      - run: echo "$VIBEBMS_VERSION" > target/${{ matrix.target }}/release/version.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: vibeBMS-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/vibebms
            target/${{ matrix.target }}/release/version.txt

  web:
    name: build web (wasm32)
    needs: test
    runs-on: ubuntu-latest
    # pushes publish the build to the gh-pages branch (GitHub Pages)
    permissions:
      contents: write
    concurrency:
      group: web-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # CI builds are <version>-nightly.<run>+<commit> (after the cache step,
      # whose key reads Cargo.toml)
      - run: ./tools/ci_version.sh
        shell: bash
      - run: cargo install wasm-bindgen-cli --locked --version "$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | cut -d'"' -f2)"
      # Lua is compiled from C for the web: clang with the WebAssembly target
      - run: clang --version
      # the runner may have only versioned llvm-ar-NN
      - run: echo "AR_wasm32_unknown_unknown=$(command -v llvm-ar || ls /usr/bin/llvm-ar-* | sort -V | tail -1)" >> "$GITHUB_ENV"
      # third parties' mirrors on by default: the repository variable
      # WEB_THIRD_PARTY=1 (Settings > Secrets and variables > Actions > Variables)
      - run: ./tools/build_web.sh
        env:
          VIBEBMS_THIRD_PARTY: ${{ vars.WEB_THIRD_PARTY }}
      # a C function nothing defines becomes an import from "env", which
      # only fails when the page loads
      - name: no undefined imports
        run: node tools/check_wasm_imports.mjs web/pkg/vibebms_web_bg.wasm
      # table servers send no CORS headers: the page reads copies next to it
      # the web build has no system fonts: Japanese / Korean titles need these
      - name: CJK fonts (Noto Sans CJK, SIL OFL 1.1)
        run: |
          base=https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans
          curl -fsSL -o web/fonts/NotoSansJP-Regular.otf "$base/SubsetOTF/JP/NotoSansJP-Regular.otf"
          curl -fsSL -o web/fonts/NotoSansKR-Regular.otf "$base/SubsetOTF/KR/NotoSansKR-Regular.otf"
          curl -fsSL -o web/fonts/NotoSansCJK-LICENSE.txt "$base/LICENSE"
          printf "NotoSansJP-Regular.otf\nNotoSansKR-Regular.otf\n" >> web/fonts/fonts.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vibeBMS-web
          path: web
      # default branch -> the site root, other branches -> preview/<branch>/
      - name: where to publish
        if: github.event_name == 'push'
        id: dest
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "${{ github.event.repository.default_branch }}" ]; then
            dir=""
          else
            dir="preview/$(echo "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._\n-' '-')"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "url=https://${owner}.github.io/${repo}/${dir:+$dir/}" >> "$GITHUB_OUTPUT"
      - name: publish to gh-pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          destination_dir: ${{ steps.dest.outputs.dir }}
          keep_files: true
          commit_message: "web build ${{ github.sha }} (${{ github.ref_name }})"
      - name: link
        if: github.event_name == 'push'
        run: |
          echo "### Web build" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.dest.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "(needs GitHub Pages: Settings > Pages > Deploy from a branch > gh-pages / root)" >> "$GITHUB_STEP_SUMMARY"

  # an unsigned .ipa: install it by signing it with your own Apple ID
  # (AltStore, Sideloadly) or a developer certificate
  ios:
    name: build iOS (unsigned, experimental)
    needs: test
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: aarch64-apple-ios
      # CI builds are <version>-nightly.<run>+<commit> (after the cache step,
      # whose key reads Cargo.toml)
      - run: ./tools/ci_version.sh
        shell: bash
      - run: cargo build --release -p vibebms --target aarch64-apple-ios
      - name: package
        run: |
          app=Payload/vibeBMS.app
          mkdir -p "$app"
          cp target/aarch64-apple-ios/release/vibebms "$app/"
          cp platform/ios/Info.plist platform/ios/*.png "$app/"
          # iOS takes numbers only: the version (0.1.0) and the run number
          plutil -replace CFBundleShortVersionString -string "$VIBEBMS_BASE_VERSION" "$app/Info.plist"
          plutil -replace CFBundleVersion -string "$VIBEBMS_BUILD" "$app/Info.plist"
          zip -qr vibeBMS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: vibeBMS-ios-unsigned
          path: vibeBMS-unsigned.ipa

  # the app in the iOS simulator: it starts, and its download browser saves
  # and unpacks a zip; screenshots and the log are uploaded
  ios-simulator:
    name: iOS simulator (smoke test)
    needs: test
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: aarch64-apple-ios-sim
      - run: cargo build --release -p vibebms --target aarch64-apple-ios-sim
      - name: app bundle
        run: |
          app="$RUNNER_TEMP/vibeBMS.app"
          mkdir -p "$app"
          cp target/aarch64-apple-ios-sim/release/vibebms "$app/"
          cp platform/ios/Info.plist platform/ios/*.png "$app/"
          plutil -replace CFBundleSupportedPlatforms -json '["iPhoneSimulator"]' "$app/Info.plist"
          codesign --force --sign - "$app"
          echo "APP=$app" >> "$GITHUB_ENV"
      - name: run in the simulator
        run: |
          # the newest iOS runtime and an iPad it supports
          rt=$(xcrun simctl list runtimes -j | jq '[.runtimes[] | select(.isAvailable and .platform == "iOS")] | last')
          runtime=$(echo "$rt" | jq -r .identifier)
          dtype=$(echo "$rt" | jq -r '[.supportedDeviceTypes[] | select(.productFamily == "iPad")] | last | .identifier')
          echo "runtime $runtime, device $dtype"
          udid=$(xcrun simctl create vibe "$dtype" "$runtime")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$APP"
          mkdir -p sim
          # 1: it starts and shows the music select
          xcrun simctl launch --stderr="$PWD/sim/start.log" "$udid" io.github.vibebms
          sleep 45
          xcrun simctl io "$udid" screenshot sim/1-start.png
          xcrun simctl terminate "$udid" io.github.vibebms || true
          sleep 2
          # 2: the download browser on a zip (this repository's)
          SIMCTL_CHILD_VIBEBMS_TEST_BROWSE="https://codeload.github.com/${{ github.repository }}/zip/${{ github.sha }}" \
            xcrun simctl launch --stderr="$PWD/sim/browse.log" "$udid" io.github.vibebms
          sleep 25
          xcrun simctl io "$udid" screenshot sim/2-browser.png
          sleep 50
          xcrun simctl io "$udid" screenshot sim/3-after.png
          xcrun simctl terminate "$udid" io.github.vibebms || true
          grep -E "Library:|Downloading|Added|failed|panicked|error" sim/start.log sim/browse.log || true
          grep -q "Library:" sim/start.log || { echo "::error::the app did not start"; exit 1; }
          grep -q "Added " sim/browse.log || echo "::warning::the browser did not download and unpack the zip"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibeBMS-ios-simulator
          path: sim

  android:
    name: build android (experimental)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # CI builds are <version>-nightly.<run>+<commit> (after the cache step,
      # whose key reads Cargo.toml)
      - run: ./tools/ci_version.sh
        shell: bash
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: cargo install cargo-ndk --locked
      # the Rust library into the Gradle project, then the APK
      - run: >-
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t x86_64 -o platform/android/app/jniLibs
          build --release -p vibebms-android
      # cargo-ndk copies every cdylib it built; only ours is loaded
      - run: find platform/android/app/jniLibs -name '*.so' ! -name libvibebms_android.so -delete
      # release APKs must be signed: with the repository's key when its
      # secrets hold one (base64 keystore + password), else a throwaway key
      # (the APK installs, but cannot update one signed by another key)
      - name: signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            pass="$KEYSTORE_PASSWORD"
          else
            pass="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$ks" -storepass "$pass" -keypass "$pass" -alias vibebms \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=vibeBMS"
          fi
          echo "::add-mask::$pass"
          # the key's alias (a keystore made for cargo-apk has one key)
          alias="$(keytool -list -keystore "$ks" -storepass "$pass" | grep -m1 PrivateKeyEntry | cut -d, -f1)"
          echo "VIBEBMS_KEYSTORE=$ks" >> "$GITHUB_ENV"
          echo "VIBEBMS_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"
          echo "VIBEBMS_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: |
          echo "VIBEBMS_VERSION_CODE=$VIBEBMS_BUILD" >> "$GITHUB_ENV"
          echo "VIBEBMS_VERSION_NAME=$VIBEBMS_VERSION" >> "$GITHUB_ENV"
      - run: gradle -p platform/android --no-daemon assembleRelease
      - run: cp platform/android/app/build/outputs/apk/release/app-release.apk vibeBMS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vibeBMS-android
          path: vibeBMS.apk

  # the "nightly" prerelease: the default branch's latest builds, each file
  # as it is (no zip but the web build's). A build that failed keeps its
  # previous file; the notes say which files this commit brought.
  nightly:
    name: nightly release
    needs: [build, build-linux-portable, android, ios, web]
    if: always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # a newer push's release wins over an older one still uploading
    concurrency:
      group: nightly-release
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vibeBMS-*
          path: art
      # the version the builds were given (tools/ci_version.sh)
      - name: version
        run: |
          base="$(curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/Cargo.toml" | grep -m1 '^version' | cut -d'"' -f2 | sed 's/[-+].*//')"
          echo "BASE_VERSION=$base" >> "$GITHUB_ENV"
          echo "VERSION=$base-nightly.$GITHUB_RUN_NUMBER+${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - name: files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir out
          for t in linux-x64 linux-arm64 linux-x64-portable linux-arm64-portable macos-arm64 macos-x64; do
            [ -f "art/vibeBMS-$t/vibebms" ] && cp "art/vibeBMS-$t/vibebms" "out/vibebms-$t"
          done
          for t in windows-x64 windows-arm64; do
            [ -f "art/vibeBMS-$t/vibebms.exe" ] && cp "art/vibeBMS-$t/vibebms.exe" "out/vibebms-$t.exe"
          done
          [ -f art/vibeBMS-android/vibeBMS.apk ] && cp art/vibeBMS-android/vibeBMS.apk out/vibeBMS.apk
          [ -f art/vibeBMS-ios-unsigned/vibeBMS-unsigned.ipa ] && cp art/vibeBMS-ios-unsigned/vibeBMS-unsigned.ipa out/vibeBMS-unsigned.ipa
          [ -d art/vibeBMS-web ] && (cd art/vibeBMS-web && zip -qr ../../out/vibeBMS-web.zip .)
          # an AltStore / SideStore source: add its URL once, and the app
          # store offers each new nightly .ipa as an update
          if [ -f out/vibeBMS-unsigned.ipa ]; then
            jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "${GITHUB_SHA:0:7}" \
              --arg version "$BASE_VERSION" --arg build "$GITHUB_RUN_NUMBER" --arg full "$VERSION" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson size "$(stat -c %s out/vibeBMS-unsigned.ipa)" '{
              name: "vibeBMS nightly",
              identifier: "io.github.vibebms.nightly",
              website: "https://github.com/\($repo)",
              apps: [{
                name: "vibeBMS",
                bundleIdentifier: "io.github.vibebms",
                developerName: "vibeBMS",
                subtitle: "BMS player",
                localizedDescription: "A cross-platform BMS player. Nightly builds of the default branch.",
                iconURL: "https://raw.githubusercontent.com/\($repo)/main/platform/ios/AppIcon76x76@2x.png",
                tintColor: "#3B82F6",
                category: "games",
                versions: [{
                  version: $version,
                  buildVersion: $build,
                  date: $date,
                  localizedDescription: "Nightly build \($full).",
                  downloadURL: "https://github.com/\($repo)/releases/download/nightly/vibeBMS-unsigned.ipa",
                  size: $size,
                  minOSVersion: "14.0"
                }],
                appPermissions: { entitlements: [], privacy: {} }
              }],
              news: []
            }' > out/altstore.new.json
            # the nightly is one app of the source: the others (a stable one,
            # for the releases to come) are kept from the previous source
            mkdir -p prev
            if ! gh release download nightly -p altstore.json -D prev --clobber 2>/dev/null \
              || ! jq -e '.apps | type == "array"' prev/altstore.json >/dev/null 2>&1; then
              echo '{"apps": []}' > prev/altstore.json
            fi
            jq --slurpfile prev prev/altstore.json '
              (.apps[0].bundleIdentifier) as $id
              | .apps += [$prev[0].apps[] | select(.bundleIdentifier != $id)]
            ' out/altstore.new.json > out/altstore.json
            rm out/altstore.new.json
          fi
          ls -l out
      # what the desktop executables' self-update reads (crates/vibebms/src/
      # update.rs, docs/BUILDING.md): the release's version and, for each
      # executable, the version it was built with, its SHA-256 and size. A
      # build that failed keeps its previous file, so its entry is kept from
      # the previous latest.json.
      - name: latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p prev
          if ! gh release download nightly -p latest.json -D prev --clobber 2>/dev/null \
            || ! jq -e 'type == "object"' prev/latest.json >/dev/null 2>&1; then
            echo '{}' > prev/latest.json
          fi
          new='{}'
          for f in out/vibebms-*; do
            [ -f "$f" ] || continue
            name="${f#out/}"
            t="${name#vibebms-}"
            t="${t%.exe}"
            v="$VERSION"
            [ -s "art/vibeBMS-$t/version.txt" ] && v="$(tr -d '[:space:]' < "art/vibeBMS-$t/version.txt")"
            new="$(jq -c --arg n "$name" --arg v "$v" \
              --arg sha "$(sha256sum "$f" | cut -d' ' -f1)" --argjson size "$(stat -c %s "$f")" \
              '. + {($n): {version: $v, sha256: $sha, size: $size}}' <<< "$new")"
          done
          # a part per channel: this job writes "nightly" and keeps the
          # others ("stable", for the releases to come)
          jq --arg version "$VERSION" --argjson new "$new" '
            (if (.channels | type) == "object" then .channels else {} end) as $ch
            | (($ch.nightly.files // .files) | if type == "object" then . else {} end) as $old
            | {channels: ($ch + {nightly: {version: $version, files: ($old + $new)}})}
          ' prev/latest.json > out/latest.json
          cat out/latest.json
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # only the branch's head is published: a newer push has its own run,
          # and GitHub lets this token point the tag only at a branch's head
          head() { gh api "repos/$GH_REPO/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha; }
          if [ "$(head)" != "$SHA" ]; then
            echo "$GITHUB_REF_NAME has moved on from ${SHA:0:7}; its own run publishes it"
            exit 0
          fi
          # the tag follows the latest commit
          if ! gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$SHA" -F force=true >/dev/null \
            && ! gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$SHA" >/dev/null; then
            [ "$(head)" != "$SHA" ] && { echo "$GITHUB_REF_NAME moved on meanwhile"; exit 0; }
            exit 1
          fi
          notes="$(
            echo "The latest build of \`${GITHUB_REF_NAME}\`: version $VERSION ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            echo
            echo "Files from this commit: $(cd out && ls | sed 's/^/`/; s/$/`/' | paste -sd ' ')"
            echo
            echo "- Linux / macOS: \`chmod +x vibebms-*\`; on macOS also \`xattr -d com.apple.quarantine vibebms-*\`."
            echo "- Linux: \`vibebms-linux-*\` needs glibc 2.35 and WebKitGTK 4.1 (\`libwebkit2gtk-4.1-0\`, for the download browser);"
            echo "  \`vibebms-linux-*-portable\` has no download browser and starts with glibc 2.28 and ALSA."
            echo "- iOS: the .ipa is unsigned (sideload it, e.g. with AltStore, SideStore or LiveContainer)."
            echo "  For updates in AltStore / SideStore, add the source https://github.com/$GH_REPO/releases/download/nightly/altstore.json"
            echo "- Web: unzip and serve the folder over HTTP(S), or use https://vibebms.github.io/vibe/."
          )"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly" --notes "$notes" --target "$SHA"
          else
            gh release create nightly --prerelease --title "Nightly" --notes "$notes" --target "$SHA"
          fi
          gh release upload nightly out/* --clobber

  # links to the executables in the run summary, once the builds are done
  downloads:
    name: downloads
    needs: [build, build-linux-portable, android, ios]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: links
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Downloads"
            echo
            echo "| build | |"
            echo "|---|---|"
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate \
              --jq '.artifacts[] | select(.name | test("^vibeBMS-(linux|windows|macos|android|ios-unsigned)")) | "\(.name)\t\(.id)\t\(.size_in_bytes)"' |
              sort | while IFS=$'\t' read -r name id size; do
                echo "| ${name#vibeBMS-} | [download]($RUN/artifacts/$id) ($((size / 1048576)) MB) |"
              done
            echo
            echo "Linux / macOS: \`chmod +x vibebms\` after unzipping; on macOS also \`xattr -d com.apple.quarantine vibebms\`."
          } >> "$GITHUB_STEP_SUMMARY"
