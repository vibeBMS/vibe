name: CI

on:
  push:
    # Dependabot's branches run as pull requests (and publish no web preview);
    # fdroid-repo is the F-Droid repository the nightly job publishes; e2e/
    # branches try the comparison tests (e2e.yml) and run only those
    branches-ignore: ['dependabot/**', 'fdroid-repo', 'e2e/**']
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch or pull request cancels the older run:
# hosted runners are limited (20 jobs, 5 of them macOS, across the
# organization), and only the newest commit's builds matter. A publish cut
# off this way is redone by the newer run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The release builds run tools/build_release.sh, which makes them
# reproducible (docs/BUILDING.md, "Reproducible builds"): the same commit and
# run number give the same bytes, which tools/reproduce.sh and the
# Reproducible builds workflow check. It also gives nightlies thin LTO over 16
# codegen units instead of the release profile's fat LTO in one unit:
# dependencies come from the cache, but fat LTO re-optimises the whole program
# single-threaded on every build (most of each build job's minutes); thin LTO
# is a few times faster to link and costs a few percent at run time. A stable
# release keeps the profile's.
env:
  CARGO_TERM_COLOR: always

jobs:
  # Only the default branch's newest cache of each job stays:
  # other refs' entries and the default branch's older ones (left when
  # Cargo.lock, the toolchain or go.sum changed) are deleted, so the
  # repository's 10 GB hold one set. It runs first, beside the builds, so a
  # newer push cancelling this run does not skip it, and the space is free
  # before this run saves. A replaced key stays until the next push: it is
  # what this run's jobs restore from.
  cache-prune:
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAIN: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          # rust-cache: v0-rust-<key>-<job>-<os>-<arch>-<environment>-<lockfiles>;
          # setup-go: setup-go-<os>-<arch>-<image>-go-<version>-<go.sum hash>;
          # gradle-<os>-<arch>-<version>-<build files hash>; gradle-<version>
          # (setup-gradle's distribution, saved even with its caching off);
          # noto-cjk-<commit>;
          # flatpak-platform-<arch>-<runtime>: the newest of each kind stays;
          # e2e-*: the comparison tests' downloads (LR2, beatoraja), kept on
          # every ref; any other key: only other refs' entries
          gh cache list --limit 1000 --sort created_at --order desc \
            --json id,key,ref,sizeInBytes --jq '.[] | "\(.id)\t\(.key)\t\(.ref)\t\(.sizeInBytes)"' |
            awk -F'\t' -v main="$MAIN" '{
              job = $2
              if (job ~ /^e2e-/) next
              # (the entries setup-gradle made before Gradle had one cache entry)
              if (job ~ /^gradle-[a-z-]+-v1[-|]/) { print $1 "\t" $2 "\t" $3 "\t" int($4 / 1048576) " MB"; next }
              # (and the pins hash in the key, so caches of older pins go too)
              if (job ~ /^v0-rust-/) { sub(/-[0-9a-f]+-[0-9a-f]+$/, "", job); sub(/-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]-/, "-", job) }
              else if (job ~ /^setup-go-/) sub(/-[0-9a-f]+$/, "", job)
              else if (job ~ /^gradle-[0-9][0-9.]*$/) job = "gradle-distribution"
              else if (job ~ /^gradle-/) sub(/-[^-]+-[0-9a-f]*$/, "", job)
              else if (job ~ /^noto-cjk-/) job = "noto-cjk"
              else if (match(job, /^flatpak-platform-[A-Za-z0-9]+-/)) job = substr(job, 1, RLENGTH)
              if ($3 != main || (job != $2 && seen[job]++)) print $1 "\t" $2 "\t" $3 "\t" int($4 / 1048576) " MB"
            }' |
            while IFS=$'\t' read -r id key ref size; do
              echo "delete $key ($ref, $size)"
              gh cache delete "$id"
            done

  # the container images and runner labels of tools/repro.env (the jobs take
  # them from here: a job's container and runner cannot read a file), and for
  # each build a short hash of its pins, in its cache key: Cargo does not see
  # a new C compiler, so the C its build scripts compiled with the old one
  # would be kept from the cache
  pins:
    name: pinned build environment
    runs-on: ubuntu-latest
    outputs:
      portable-x64: ${{ steps.pins.outputs.portable-x64 }}
      portable-arm64: ${{ steps.pins.outputs.portable-arm64 }}
      web: ${{ steps.pins.outputs.web }}
      linux-x64: ${{ steps.pins.outputs.linux-x64 }}
      linux-arm64: ${{ steps.pins.outputs.linux-arm64 }}
      macos: ${{ steps.pins.outputs.macos }}
      windows: ${{ steps.pins.outputs.windows }}
      key-linux: ${{ steps.pins.outputs.key-linux }}
      key-portable: ${{ steps.pins.outputs.key-portable }}
      key-web: ${{ steps.pins.outputs.key-web }}
      key-macos: ${{ steps.pins.outputs.key-macos }}
      key-windows: ${{ steps.pins.outputs.key-windows }}
      key-android: ${{ steps.pins.outputs.key-android }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/repro.env
            tools/linux-arm64.lock
          sparse-checkout-cone-mode: false
      - id: pins
        run: |
          . tools/repro.env
          key() { printf '%s\n' "$@" | sha256sum | cut -c1-8; }
          {
            echo "portable-x64=$PORTABLE_IMAGE_X64"
            echo "portable-arm64=$PORTABLE_IMAGE_ARM64"
            echo "web=$WEB_IMAGE"
            echo "linux-x64=$LINUX_IMAGE_X64"
            echo "linux-arm64=$LINUX_IMAGE_ARM64"
            echo "macos=$MACOS_RUNNER"
            echo "windows=$WINDOWS_RUNNER"
            echo "key-linux=$(key "$LINUX_IMAGE_X64" "$LINUX_IMAGE_ARM64" "$UBUNTU_SNAPSHOT" "$LINUX_PACKAGES" "$(cat tools/linux-arm64.lock)")"
            echo "key-portable=$(key "$PORTABLE_IMAGE_X64" "$PORTABLE_IMAGE_ARM64" "$PORTABLE_PACKAGES")"
            echo "key-web=$(key "$WEB_IMAGE" "$UBUNTU_SNAPSHOT" "$WEB_PACKAGES")"
            echo "key-macos=$(key "$MACOS_RUNNER" "$XCODE_VERSION")"
            echo "key-windows=$(key "$WINDOWS_RUNNER" "$MSVC_COMPONENT" "$WINDOWS_SDK")"
            echo "key-android=$(key "$NDK_VERSION" "$CARGO_NDK_VERSION")"
          } | tee -a "$GITHUB_OUTPUT"

  test:
    name: test (lint + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apt
        with:
          packages: libasound2-dev libudev-dev libwebkit2gtk-4.1-dev
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy
          stamp: "false"
      # the built-in skins committed are what their generator makes, with
      # the Pillow (its FreeType) and the Inter faces they were made with:
      # another Inter version moves every glyph
      - name: built-in skins up to date
        run: |
          deb=fonts-inter_4.0+ds-1_all.deb
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$deb" "http://archive.ubuntu.com/ubuntu/pool/universe/f/fonts-inter/$deb"
          echo "d1ca9cc3e26c347bd31977d4693bf6c371ee6b81a711e092923c8160c02e88ce  $RUNNER_TEMP/$deb" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/$deb" "$RUNNER_TEMP/inter"
          python3 -m venv "$RUNNER_TEMP/skins"
          "$RUNNER_TEMP/skins/bin/pip" install -q pillow==12.3.0
          "$RUNNER_TEMP/skins/bin/python" tools/gen_default_skins.py --check \
            --fonts "$RUNNER_TEMP/inter/usr/share/fonts/opentype/inter"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # lint the code other targets compile (cfg'd out on Linux) in minutes,
  # before the release builds; iOS needs a Mac: its build job covers it
  cross-check:
    name: cross-check (wasm32, android)
    needs: pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android
          components: clippy
          cache-key: cross-check-${{ needs.pins.outputs.key-android }}
          stamp: "false"
      # Lua is compiled from C for the web: clang with the WebAssembly target
      - run: clang --version
      # the runner may have only versioned llvm-ar-NN
      - run: echo "AR_wasm32_unknown_unknown=$(command -v llvm-ar || ls /usr/bin/llvm-ar-* | sort -V | tail -1)" >> "$GITHUB_ENV"
      - run: cargo clippy -p vibebms -p vibebms-web -p vibebms-lua-web --lib --target wasm32-unknown-unknown -- -D warnings
      # the NDK and cargo-ndk the APK is built with
      - uses: ./.github/actions/android-setup
        with:
          java: "false"
      - run: cargo ndk -t arm64-v8a --platform 26 clippy -p vibebms -p vibebms-android -- -D warnings

  # each Linux executable with the in-app browser, then the same executable as
  # a Flatpak. One job per architecture, on the Ubuntu 22.04 runner:
  # - the executable is built in the pinned Ubuntu 22.04 image (glibc 2.35
  #   and WebKitGTK 4.1, the oldest base that has it: Ubuntu 22.04, Debian 12
  #   and newer; `build-linux-portable` has the rest), its packages from the
  #   Ubuntu snapshot (x64) or as tools/linux-arm64.lock lists them (arm64:
  #   the ports archive has no snapshot) (the image by digest and the
  #   packages: tools/repro.env; tools/reproduce.sh builds the same). Only
  #   that step runs in it (docker run), with the runner's Rust, CARGO_HOME
  #   and target folder mounted where they are, so rust-cache restores and
  #   saves them as for any build;
  # - the Flatpak is packaged on the runner (as it is, on the GNOME runtime,
  #   which has WebKitGTK 4.1; a bundle per architecture, as a bundle holds
  #   one: tools/package_flatpak.sh, platform/flatpak): bubblewrap needs the
  #   host's user namespaces. The executable's artifact is uploaded before
  #   the Flatpak steps, which do not fail the job, so the nightly has the
  #   executable either way and the caches are saved.
  build-linux:
    name: build ${{ matrix.name }}
    needs: [test, pins]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            loader: /lib64/ld-linux-x86-64.so.2
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            loader: /lib/ld-linux-aarch64.so.1
    runs-on: ${{ matrix.os }}
    env:
      # (rust-cache's: its cache is saved when only the Flatpak failed)
      CACHE_ON_FAILURE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apt
        with:
          # faketime: the bundle carries the time it is made, which it makes
          # the commit's (a reproducible bundle)
          packages: faketime
          # the Flatpak's (appstream-compose for `appstreamcli compose`),
          # without their Recommends (desktop portals, speech data: not needed
          # to package)
          packages-without-recommends: flatpak desktop-file-utils appstream appstream-compose
      # Rust on the runner, the cache, and the version, app id, name and
      # branch (tools/ci_version.sh; the Flatpak takes them too, e.g.
      # io.github.vibebms.nightly, "vibeBMS Nightly")
      - uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.name }}-${{ needs.pins.outputs.key-linux }}
      # in the pinned image: its packages as root (tools/build_deps.sh), then
      # tools/build_release.sh as the runner's user, so what it writes into the
      # mounted folders stays the runner's
      - name: build (in the pinned image)
        env:
          IMAGE: ${{ matrix.arch == 'x64' && needs.pins.outputs.linux-x64 || needs.pins.outputs.linux-arm64 }}
          ARTIFACT: ${{ matrix.name }}
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}" rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          USER_IDS="$(id -u):$(id -g)"
          export SOURCE_DATE_EPOCH USER_IDS
          # shellcheck disable=SC2016 # expanded in the container
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -v "$cargo_home:$cargo_home" -v "$rustup_home:$rustup_home" \
            -e CARGO_HOME="$cargo_home" -e RUSTUP_HOME="$rustup_home" -e HOME=/tmp/build-home \
            -e PATH="$cargo_home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            -e ARTIFACT -e USER_IDS -e SOURCE_DATE_EPOCH -e CARGO_TERM_COLOR \
            -e VIBEBMS_CHANNEL -e VIBEBMS_VERSION -e VIBEBMS_BASE_VERSION -e VIBEBMS_BUILD -e VIBEBMS_COMMIT \
            -e VIBEBMS_APP_ID -e VIBEBMS_APP_NAME \
            "$IMAGE" bash -c '
              set -euo pipefail
              tools/build_deps.sh "$ARTIFACT"
              mkdir -p "$HOME" && chown "$USER_IDS" "$HOME"
              exec setpriv --reuid="${USER_IDS%:*}" --regid="${USER_IDS#*:}" --clear-groups \
                tools/build_release.sh "$ARTIFACT"'
      # the version it was built with, for the nightly's latest.json
      - run: echo "$VIBEBMS_VERSION" > target/${{ matrix.target }}/release/version.txt
      # the executable alone (the downloads job links it in the run summary)
      - uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/vibebms
            target/${{ matrix.target }}/release/version.txt
      - name: Flatpak runtime
        run: |
          # org.gnome.Platform//51, from the manifest
          echo "RUNTIME=$(grep -E '^(runtime|runtime-version):' platform/flatpak/vibebms.yml | tr -d "'" | cut -d' ' -f2 | paste -sd/ | sed 's|/|//|')" >> "$GITHUB_ENV"
          # Ubuntu 24.04 and newer deny unprivileged user namespaces to
          # programs without an AppArmor profile; `flatpak run`'s bubblewrap
          # (the check) needs them (22.04 may not have the setting)
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ "$(cat "$f" 2>/dev/null)" = 1 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # the runtime alone (about 430 MB from Flathub; the packaging needs
      # neither it nor the SDK, the check runs in it), installed for the user
      # by the first run with this runtime
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak
          key: flatpak-platform-${{ runner.arch }}-${{ env.RUNTIME }}
      # a failed Flatpak fails the job (after the executable's upload; the Rust
      # cache is saved all the same, CACHE_ON_FAILURE), so nothing is released
      # or published
      - id: flatpak
        continue-on-error: true
        run: tools/package_flatpak.sh target/${{ matrix.target }}/release/vibebms out
      # the bundle installs, and every library the executable links (WebKitGTK
      # 4.1 among them) is in the runtime. --no-related leaves out the runtime's
      # GL drivers, codecs and translations (another ~1 GB in the cache), which
      # the check does not need
      - name: check the Flatpak
        id: flatpak-check
        if: steps.flatpak.outcome == 'success'
        continue-on-error: true
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --no-related flathub "$RUNTIME"
          flatpak install --user --noninteractive --no-related out/vibeBMS-linux-${{ matrix.arch }}.flatpak
          flatpak run --command=${{ matrix.loader }} "$VIBEBMS_APP_ID" --list /app/bin/vibebms | tee out/libs.txt
          grep -q 'libwebkit2gtk-4\.1\.so.* => /' out/libs.txt
          ! grep 'not found' out/libs.txt
      - if: steps.flatpak-check.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-linux-${{ matrix.arch }}-flatpak
          path: out/vibeBMS-linux-${{ matrix.arch }}.flatpak
      - if: steps.flatpak.outcome == 'failure' || steps.flatpak-check.outcome == 'failure'
        run: |
          echo "::error::the Flatpak (linux-${{ matrix.arch }}) failed: nothing is released or published"
          exit 1

  # on the pinned runner image, with its pinned MSVC toolset and Windows SDK
  # (tools/repro.env; tools/build_release.sh selects them through
  # vcvarsall.bat, adds the toolset's ARM64 tools with the Visual Studio
  # installer, which the image lacks, and stops if it cannot)
  build-windows:
    name: build ${{ matrix.name }}
    needs: [test, pins]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, target: aarch64-pc-windows-msvc }
    runs-on: ${{ needs.pins.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build
        with:
          name: ${{ matrix.name }}
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}-${{ needs.pins.outputs.key-windows }}

  # macOS: both architectures on one runner (x86_64 cross-built on the arm64
  # one), then the app: one universal executable in an ad-hoc signed bundle
  # (tools/package_macos.sh), as a .dmg for people and a .zip for the
  # self-update. One job, not three: macOS runners are few, and jobs that
  # waited too long for one were cancelled. On the pinned runner image with
  # its pinned Xcode (tools/repro.env; tools/build_release.sh and
  # tools/package_macos.sh select it and stop if the image lacks it).
  macos:
    name: build macOS (arm64, x64, universal app)
    needs: [test, pins]
    runs-on: ${{ needs.pins.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          cache-key: macos-universal-${{ needs.pins.outputs.key-macos }}
      - run: tools/build_release.sh macos
      # each executable as the other builds give theirs (the nightly's
      # vibebms-macos-arm64 / -x64 and latest.json read these artifacts)
      - name: executables
        run: |
          for t in arm64:aarch64 x64:x86_64; do
            mkdir -p "art/vibeBMS-macos-${t%%:*}"
            cp "target/${t#*:}-apple-darwin/release/vibebms" "art/vibeBMS-macos-${t%%:*}/"
            echo "$VIBEBMS_VERSION" > "art/vibeBMS-macos-${t%%:*}/version.txt"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-macos-arm64
          path: art/vibeBMS-macos-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-macos-x64
          path: art/vibeBMS-macos-x64
      - name: package
        run: |
          mkdir out
          tools/package_macos.sh art/vibeBMS-macos-arm64/vibebms art/vibeBMS-macos-x64/vibebms out
          # the version the executables were built with, for latest.json
          echo "$VIBEBMS_VERSION" > out/version.txt
      - uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-macos-universal
          path: |
            out/vibeBMS-macos-universal.dmg
            out/vibebms-macos-universal.app.zip
            out/version.txt

  # Linux without the download browser (no WebKitGTK / GTK), built against
  # glibc 2.28 in a manylinux_2_28 (AlmaLinux 8) container: it starts on
  # older and more distributions (RHEL 8, Debian 10, Ubuntu 20.04) and needs
  # only ALSA and libudev
  # (the image by digest and its packages: tools/repro.env; tools/reproduce.sh
  # builds the same in the same image)
  build-linux-portable:
    name: build ${{ matrix.name }}
    needs: [test, pins]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-portable, os: ubuntu-latest, arch: x64, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64-portable, os: ubuntu-24.04-arm, arch: arm64, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.arch == 'x64' && needs.pins.outputs.portable-x64 || needs.pins.outputs.portable-arm64 }}
    steps:
      - uses: actions/checkout@v7
      - run: tools/build_deps.sh ${{ matrix.name }}
      - uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.name }}-${{ needs.pins.outputs.key-portable }}
      # (it checks that the executable needs glibc 2.28 at most)
      - run: tools/build_release.sh ${{ matrix.name }}
      # the version it was built with, for the nightly's latest.json
      - run: echo "$VIBEBMS_VERSION" > target/${{ matrix.target }}/release/version.txt
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/vibebms
            target/${{ matrix.target }}/release/version.txt

  # in a pinned image with pinned packages (tools/repro.env): clang, which
  # compiles Lua into the module, is part of what makes the build
  web:
    name: build web (wasm32)
    needs: [test, pins]
    runs-on: ubuntu-latest
    container: ${{ needs.pins.outputs.web }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      # (the image has no git yet: the checkout is the commit's files, which is
      # all the build needs)
      - uses: actions/checkout@v7
      - run: tools/build_deps.sh web
      - uses: ./.github/actions/rust-setup
        with:
          targets: wasm32-unknown-unknown
          cache-key: web-${{ needs.pins.outputs.key-web }}
      - run: cargo install wasm-bindgen-cli --locked --version "$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | cut -d'"' -f2)"
      # the CJK fonts (about 25 MB from GitHub) from an earlier run, keyed by
      # the noto-cjk commit tools/build_release.sh pins (it checks each file's
      # hash and downloads it again if it is not the one it pins)
      - id: noto
        run: echo "commit=$(grep -o 'noto-cjk/[0-9a-f]\{40\}' tools/build_release.sh | head -1 | cut -c10-21)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            web/fonts/NotoSans*-Regular.otf
            web/fonts/NotoSansCJK-LICENSE.txt
          key: noto-cjk-${{ steps.noto.outputs.commit }}
      # web/pkg and the CJK fonts (Noto Sans CJK, SIL OFL 1.1, at a fixed
      # commit). Third parties' mirrors on by default: the repository variable
      # WEB_THIRD_PARTY=1 (Settings > Secrets and variables > Actions >
      # Variables), which a rebuild of the web build takes too
      - run: tools/build_release.sh web
        env:
          VIBEBMS_THIRD_PARTY: ${{ vars.WEB_THIRD_PARTY }}
      # a C function nothing defines becomes an import from "env", which
      # only fails when the page loads
      - name: no undefined imports
        run: node tools/check_wasm_imports.mjs web/pkg/vibebms_web_bg.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-web
          path: web
      # the default branch's build is the site (other branches' stay artifacts)
      - if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  # GitHub Pages (Settings > Pages > Source: GitHub Actions): each deploy
  # replaces the whole site with the default branch's web build, once every
  # build of the commit has passed (the site and the nightly then agree)
  pages:
    needs: [test, cross-check, build-linux, build-windows, build-linux-portable, macos, android, ios, web]
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # one deploy after another, none stopped half way
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # an unsigned .ipa: install it by signing it with your own Apple ID
  # (AltStore, Sideloadly) or a developer certificate
  ios:
    name: build iOS (unsigned)
    needs: [test, pins]
    # (the pinned image and Xcode, as the macOS build's)
    runs-on: ${{ needs.pins.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          targets: aarch64-apple-ios
          cache-key: aarch64-apple-ios-${{ needs.pins.outputs.key-macos }}
      # the app (iOS 14 and later; each channel its own: io.github.vibebms.nightly,
      # "vibeBMS Nightly"), zipped as Payload/vibeBMS.app
      - run: tools/build_release.sh ios out
      - uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-ios-unsigned
          path: out/vibeBMS-unsigned.ipa

  android:
    name: build android (experimental)
    needs: [test, pins]
    runs-on: ubuntu-latest
    outputs:
      # "repository" (ANDROID_KEYSTORE) or "throwaway": the nightly job
      # publishes the F-Droid repository only for the first, as an APK signed
      # by another key cannot update the installed one
      signing: ${{ steps.key.outputs.signing }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          targets: aarch64-linux-android,x86_64-linux-android
          cache-key: android-${{ needs.pins.outputs.key-android }}
      # the NDK, cargo-ndk, the JDK and Gradle of tools/repro.env
      - uses: ./.github/actions/android-setup
      # release APKs must be signed: with the repository's key when its
      # secrets hold one (base64 keystore + password), else a throwaway key
      # (the APK installs, but cannot update one signed by another key)
      - name: signing key
        id: key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            pass="$KEYSTORE_PASSWORD"
            echo "signing=repository" >> "$GITHUB_OUTPUT"
          else
            pass="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$ks" -storepass "$pass" -keypass "$pass" -alias vibebms \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=vibeBMS"
            echo "signing=throwaway" >> "$GITHUB_OUTPUT"
          fi
          echo "::add-mask::$pass"
          # the key's alias (a keystore made for cargo-apk has one key)
          alias="$(keytool -list -keystore "$ks" -storepass "$pass" | grep -m1 PrivateKeyEntry | cut -d, -f1)"
          echo "VIBEBMS_KEYSTORE=$ks" >> "$GITHUB_ENV"
          echo "VIBEBMS_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"
          echo "VIBEBMS_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
      # the Rust library into the Gradle project, then the APK (versionCode:
      # the run number; versionName: the version)
      - run: tools/build_release.sh android out
      - uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-android
          path: out/vibeBMS.apk

  # the "nightly" prerelease: the default branch's latest builds, each file
  # as it is (no zip but the web build's). A build that failed keeps its
  # previous file; the notes say which files this commit brought.
  # The run's downloads (a summary with each build's artifact link, on every
  # run) and, for a push to the default branch, the rolling nightly release
  nightly:
    name: downloads & nightly
    needs: [test, cross-check, build-linux, build-windows, build-linux-portable, macos, android, ios, web]
    if: always()
    runs-on: ubuntu-latest
    env:
      # released only when every build passed (the Flatpaks included); the
      # downloads summary is written either way
      RELEASE: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
    # a newer push's release wins over an older one still uploading (only
    # releases share the group: other runs must not cancel them)
    concurrency:
      group: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'nightly-release' || format('downloads-{0}', github.run_id) }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: write
    steps:
      - name: links
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Downloads"
            echo
            echo "| build | |"
            echo "|---|---|"
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate \
              --jq '.artifacts[] | select(.name | test("^vibeBMS-(linux|windows|macos|android|ios-unsigned)")) | "\(.name)\t\(.id)\t\(.size_in_bytes)"' |
              sort | while IFS=$'\t' read -r name id size; do
                echo "| ${name#vibeBMS-} | [download]($RUN/artifacts/$id) ($((size / 1048576)) MB) |"
              done
            echo
            echo "Linux / macOS: \`chmod +x vibebms\` after unzipping; on macOS also \`xattr -d com.apple.quarantine vibebms\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8
        if: env.RELEASE == 'true'
        with:
          pattern: vibeBMS-*
          path: art
      # the scripts (the web build's zip, the F-Droid repository), and the
      # commit's time for the zip
      - uses: actions/checkout@v7
        if: env.RELEASE == 'true'
        with:
          path: src
          persist-credentials: false
          sparse-checkout: |
            tools
            platform/android/fdroid
            assets/logo
      # the version the builds were given (tools/ci_version.sh)
      - name: version
        if: env.RELEASE == 'true'
        run: |
          base="$(curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/Cargo.toml" | grep -m1 '^version' | cut -d'"' -f2 | sed 's/[-+].*//')"
          echo "BASE_VERSION=$base" >> "$GITHUB_ENV"
          echo "VERSION=$base-nightly.$GITHUB_RUN_NUMBER+${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - name: files
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir out
          for t in linux-x64 linux-arm64 linux-x64-portable linux-arm64-portable macos-arm64 macos-x64; do
            [ -f "art/vibeBMS-$t/vibebms" ] && cp "art/vibeBMS-$t/vibebms" "out/vibebms-$t"
          done
          for t in windows-x64 windows-arm64; do
            [ -f "art/vibeBMS-$t/vibebms.exe" ] && cp "art/vibeBMS-$t/vibebms.exe" "out/vibebms-$t.exe"
          done
          for f in vibeBMS-macos-universal.dmg vibebms-macos-universal.app.zip; do
            [ -f "art/vibeBMS-macos-universal/$f" ] && cp "art/vibeBMS-macos-universal/$f" "out/$f"
          done
          for a in x64 arm64; do
            f="vibeBMS-linux-$a.flatpak"
            [ -f "art/vibeBMS-linux-$a-flatpak/$f" ] && cp "art/vibeBMS-linux-$a-flatpak/$f" "out/$f"
          done
          [ -f art/vibeBMS-android/vibeBMS.apk ] && cp art/vibeBMS-android/vibeBMS.apk out/vibeBMS.apk
          [ -f art/vibeBMS-ios-unsigned/vibeBMS-unsigned.ipa ] && cp art/vibeBMS-ios-unsigned/vibeBMS-unsigned.ipa out/vibeBMS-unsigned.ipa
          # the same zip as tools/reproduce.sh makes of its web build
          [ -d art/vibeBMS-web ] && SOURCE_DATE_EPOCH="$(git -C src log -1 --format=%ct)" \
            src/tools/build_release.sh zip out/vibeBMS-web.zip art/vibeBMS-web
          # an AltStore / SideStore source: add its URL once, and the app
          # store offers each new nightly .ipa as an update
          if [ -f out/vibeBMS-unsigned.ipa ]; then
            jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "${GITHUB_SHA:0:7}" \
              --arg version "$BASE_VERSION" --arg build "$GITHUB_RUN_NUMBER" --arg full "$VERSION" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson size "$(stat -c %s out/vibeBMS-unsigned.ipa)" '{
              name: "vibeBMS",
              identifier: "io.github.vibebms.source",
              website: "https://github.com/\($repo)",
              apps: [{
                name: "vibeBMS Nightly",
                bundleIdentifier: "io.github.vibebms.nightly",
                developerName: "vibeBMS",
                subtitle: "BMS player",
                localizedDescription: "A cross-platform BMS player. Nightly builds of the default branch.",
                iconURL: "https://raw.githubusercontent.com/\($repo)/main/platform/ios/AppIcon76x76@2x.png",
                tintColor: "#3B82F6",
                category: "games",
                versions: [{
                  version: $version,
                  buildVersion: $build,
                  date: $date,
                  localizedDescription: "Nightly build \($full).",
                  downloadURL: "https://github.com/\($repo)/releases/download/nightly/vibeBMS-unsigned.ipa",
                  size: $size,
                  minOSVersion: "14.0"
                }],
                appPermissions: { entitlements: [], privacy: {} }
              }],
              news: []
            }' > out/altstore.new.json
            # the nightly is one app of the source: the others (a stable one,
            # for the releases to come) are kept from the previous source
            mkdir -p prev
            if ! gh release download nightly -p altstore.json -D prev --clobber 2>/dev/null \
              || ! jq -e '.apps | type == "array"' prev/altstore.json >/dev/null 2>&1; then
              echo '{"apps": []}' > prev/altstore.json
            fi
            jq --slurpfile prev prev/altstore.json '
              (.apps[0].bundleIdentifier) as $id
              | (.apps[0].versions[0].downloadURL) as $url
              | .apps += [$prev[0].apps[]
                  | select(.bundleIdentifier != $id and ((.versions[0].downloadURL // "") != $url))]
            ' out/altstore.new.json > out/altstore.json
            rm out/altstore.new.json
          fi
          ls -l out
      # what the desktop executables' self-update reads (crates/vibebms/src/
      # update/, docs/BUILDING.md): the release's version and, for each
      # executable, the version it was built with, its SHA-256 and size. A
      # build that failed keeps its previous file, so its entry is kept from
      # the previous latest.json.
      - name: latest.json
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p prev
          if ! gh release download nightly -p latest.json -D prev --clobber 2>/dev/null \
            || ! jq -e 'type == "object"' prev/latest.json >/dev/null 2>&1; then
            echo '{}' > prev/latest.json
          fi
          new='{}'
          for f in out/vibebms-*; do
            [ -f "$f" ] || continue
            name="${f#out/}"
            t="${name#vibebms-}"
            t="${t%.exe}"
            t="${t%.app.zip}"
            v="$VERSION"
            [ -s "art/vibeBMS-$t/version.txt" ] && v="$(tr -d '[:space:]' < "art/vibeBMS-$t/version.txt")"
            new="$(jq -c --arg n "$name" --arg v "$v" \
              --arg sha "$(sha256sum "$f" | cut -d' ' -f1)" --argjson size "$(stat -c %s "$f")" \
              '. + {($n): {version: $v, sha256: $sha, size: $size}}' <<< "$new")"
          done
          # a part per channel: this job writes "nightly" and keeps the
          # others ("stable", for the releases to come)
          jq --arg version "$VERSION" --argjson new "$new" '
            (if (.channels | type) == "object" then .channels else {} end) as $ch
            | (($ch.nightly.files // .files) | if type == "object" then . else {} end) as $old
            | {channels: ($ch + {nightly: {version: $version, files: ($old + $new)}})}
          ' prev/latest.json > out/latest.json
          cat out/latest.json
      # every published build's executables, for IR operators who accept a
      # client by its executable's SHA-256 (docs/BUILDING.md,
      # crates/vibebms/src/ir/build_id.rs): appended to the previous
      # builds.json, nightlies kept 90 days (500 at most), releases always.
      # Files inside a package are hashed as they run: the macOS app's
      # executable and the Android libraries.
      - name: builds.json
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p prev
          if ! gh release download nightly -p builds.json -D prev --clobber 2>/dev/null \
            || ! jq -e '.builds | type == "array"' prev/builds.json >/dev/null 2>&1; then
            echo '{"builds": []}' > prev/builds.json
          fi
          files='{}'
          add() { # <name> <file>
            files="$(jq -c --arg n "$1" --arg sha "$(sha256sum "$2" | cut -d' ' -f1)" \
              --argjson size "$(stat -c %s "$2")" '. + {($n): {sha256: $sha, size: $size}}' <<< "$files")"
          }
          for f in out/vibebms-linux-* out/vibebms-macos-arm64 out/vibebms-macos-x64 out/vibebms-windows-*.exe; do
            [ -f "$f" ] && add "${f#out/}" "$f"
          done
          inner="$(mktemp)"
          for pkg in vibebms-macos-universal.app.zip vibeBMS.apk; do
            [ -f "out/$pkg" ] || continue
            while IFS= read -r f; do
              unzip -p "out/$pkg" "$f" > "$inner"
              add "$pkg/$f" "$inner"
            done < <(unzip -Z1 "out/$pkg" | grep -E '\.app/Contents/MacOS/vibebms$|^lib/[^/]+/libvibebms_android\.so$')
          done
          jq --arg version "$VERSION" --arg commit "$GITHUB_SHA" --argjson files "$files" \
            --arg channel "${VIBEBMS_CHANNEL:-nightly}" --argjson run "$GITHUB_RUN_NUMBER" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg since "$(date -u -d '90 days ago' +%Y-%m-%dT%H:%M:%SZ)" '
            def nightly: (.version // "-") | test("-");
            # a run done again replaces its entry; a run that built nothing adds none
            .builds
            | if $files == {} then . else
                [.[] | select(.version != $version)] + [{version: $version, channel: $channel, run: $run, commit: $commit, date: $date, files: $files}]
              end
            | ([.[] | select(nightly)] | length - 500) as $over
            | {v: 1, builds: (reduce .[] as $b ({n: 0, out: []};
                if ($b | nightly) then
                  .n += 1 | if .n > $over and $b.date >= $since then .out += [$b] else . end
                else .out += [$b] end) | .out)}
          ' prev/builds.json > out/builds.json
          jq -c '.builds[-1]' out/builds.json
      # the F-Droid repository (tools/fdroid_repo.sh, docs/BUILDING.md): the
      # APK as uploaded, the only version, in an index signed with
      # FDROID_KEYSTORE (else ANDROID_KEYSTORE). Built here, so fdroid.txt
      # (address, fingerprint, link) goes up with the release; pushed to the
      # fdroid-repo branch once the release is published. Only an APK signed
      # with the repository's key goes in: one signed by a throwaway key could
      # not update the installed app. A failure here holds back nothing else.
      - name: F-Droid repository
        id: fdroid
        if: env.RELEASE == 'true'
        continue-on-error: true
        env:
          APK_SIGNING: ${{ needs.android.outputs.signing }}
          FDROID_KS_B64: ${{ secrets.FDROID_KEYSTORE }}
          FDROID_KS_PASS: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          ANDROID_KS_B64: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FDROID_REPO_URL: https://raw.githubusercontent.com/${{ github.repository }}/fdroid-repo/repo
        run: |
          skip() {
            echo "F-Droid repository not updated: $1"
            printf '### F-Droid repository\n\nNot updated: %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [ -f out/vibeBMS.apk ] || skip "this run built no APK (the repository keeps the previous one)."
          secrets="(docs/BUILDING.md, \"F-Droid repository\")"
          [ "$APK_SIGNING" = repository ] ||
            skip "the APK was signed with a throwaway key, so it could not update an installed one. Add the secrets \`ANDROID_KEYSTORE\` (the keystore, base64) and \`ANDROID_KEYSTORE_PASSWORD\` $secrets."
          # a key that stays: one made per run would change the fingerprint
          # the clients pinned
          if [ -n "$FDROID_KS_B64" ]; then
            b64="$FDROID_KS_B64" pass="$FDROID_KS_PASS"
          elif [ -n "$ANDROID_KS_B64" ]; then
            b64="$ANDROID_KS_B64" pass="$ANDROID_KS_PASS"
          else
            skip "no key to sign its index: add the secrets \`FDROID_KEYSTORE\` and \`FDROID_KEYSTORE_PASSWORD\`, or \`ANDROID_KEYSTORE\` and \`ANDROID_KEYSTORE_PASSWORD\` $secrets."
          fi
          echo "::add-mask::$pass"
          export FDROID_KEYSTORE_FILE="$RUNNER_TEMP/fdroid.keystore" FDROID_KEYSTORE_PASS="$pass"
          echo "$b64" | base64 -d > "$FDROID_KEYSTORE_FILE"
          # the index for older clients is signed with SHA1withRSA: an EC key (as the APK's may be)
          # would leave it unsigned
          if ! keytool -list -v -keystore "$FDROID_KEYSTORE_FILE" -storepass "$pass" |
            grep -q '^Subject Public Key Algorithm: .*RSA'; then
            rm "$FDROID_KEYSTORE_FILE"
            skip "its key is not an RSA key, which F-Droid's index needs: add the secrets \`FDROID_KEYSTORE\` and \`FDROID_KEYSTORE_PASSWORD\` with an RSA key $secrets."
          fi
          python3 -m venv "$RUNNER_TEMP/fdroidserver"
          "$RUNNER_TEMP/fdroidserver/bin/pip" install -q fdroidserver==2.4.5
          PATH="$RUNNER_TEMP/fdroidserver/bin:$PATH" src/tools/fdroid_repo.sh build out/vibeBMS.apk "$RUNNER_TEMP/fdroid"
          rm "$FDROID_KEYSTORE_FILE"
          cp "$RUNNER_TEMP/fdroid/fdroid.txt" "$RUNNER_TEMP/fdroid/fdroid-qr.png" out/
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: release
        id: release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # only the branch's head is published: a newer push has its own run,
          # and GitHub lets this token point the tag only at a branch's head
          head() { gh api "repos/$GH_REPO/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha; }
          if [ "$(head)" != "$SHA" ]; then
            echo "$GITHUB_REF_NAME has moved on from ${SHA:0:7}; its own run publishes it"
            exit 0
          fi
          # the tag follows the latest commit
          if ! gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$SHA" -F force=true >/dev/null \
            && ! gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$SHA" >/dev/null; then
            [ "$(head)" != "$SHA" ] && { echo "$GITHUB_REF_NAME moved on meanwhile"; exit 0; }
            exit 1
          fi
          notes="$(
            echo "The latest build of \`${GITHUB_REF_NAME}\`: version $VERSION ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            echo
            echo "Files from this commit: $(cd out && ls | sed 's/^/`/; s/$/`/' | paste -sd ' ')"
            echo
            echo "- macOS: \`vibeBMS-macos-universal.dmg\` has the app (Apple silicon and Intel): drag it to Applications."
            echo "  It is not notarized: open it the first time with right-click → Open, or in"
            echo "  System Settings → Privacy & Security → Open Anyway."
            echo "- Linux / macOS executables: \`chmod +x vibebms-*\`; on macOS also \`xattr -d com.apple.quarantine vibebms-*\`."
            echo "- Linux: \`vibebms-linux-*\` needs glibc 2.35 and WebKitGTK 4.1 (\`libwebkit2gtk-4.1-0\`, for the download browser);"
            echo "  \`vibebms-linux-*-portable\` has no download browser and starts with glibc 2.28 and ALSA."
            echo "- Linux Flatpak (x64, arm64): \`flatpak install --user vibeBMS-linux-x64.flatpak\` (or \`-arm64\`; it fetches the GNOME runtime from Flathub),"
            echo "  then start \"vibeBMS Nightly\" or \`flatpak run io.github.vibebms.nightly\`. It does not update itself: install a newer"
            echo "  bundle the same way. Its data is in \`~/.var/app/io.github.vibebms.nightly/data/vibeBMS\`."
            echo "- Android: \`vibeBMS.apk\`. For updates in F-Droid, Droid-ify or Neo Store, add the F-Droid repository"
            echo "  https://raw.githubusercontent.com/$GH_REPO/fdroid-repo/repo (its fingerprint and a link are in \`fdroid.txt\`)."
            echo "- iOS: the .ipa is unsigned (sideload it, e.g. with AltStore, SideStore or LiveContainer)."
            echo "  For updates in AltStore / SideStore, add the source https://github.com/$GH_REPO/releases/download/nightly/altstore.json"
            echo "- Web: unzip and serve the folder over HTTP(S), or use https://vibebms.github.io/vibe/."
          )"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly" --notes "$notes" --target "$SHA"
          else
            gh release create nightly --prerelease --title "Nightly" --notes "$notes" --target "$SHA"
          fi
          gh release upload nightly out/* --clobber
          echo "published=true" >> "$GITHUB_OUTPUT"
      # the F-Droid repository's branch: one commit, replaced each time (the
      # older APKs are not kept). The release's concurrency group lets one run
      # at a time get here, and only the branch's head is published.
      - name: publish the F-Droid repository
        if: env.RELEASE == 'true' && steps.release.outputs.published == 'true' && steps.fdroid.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$(gh api "repos/$GH_REPO/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)" != "$SHA" ]; then
            echo "$GITHUB_REF_NAME has moved on from ${SHA:0:7}; its own run publishes it"
            exit 0
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          src/tools/fdroid_repo.sh push "$RUNNER_TEMP/fdroid" "https://github.com/$GH_REPO.git" fdroid-repo
          url="https://raw.githubusercontent.com/$GH_REPO/fdroid-repo/repo"
          fp="$(cat "$RUNNER_TEMP/fdroid/fingerprint")"
          {
            echo "### F-Droid repository"
            echo
            echo "Updated with $(cat "$RUNNER_TEMP/fdroid/app_id") $VERSION. Add it in F-Droid, Droid-ify or Neo Store:"
            echo
            echo "- address: $url"
            echo "- fingerprint (SHA-256): \`$fp\`"
            echo "- link (open it on the phone): \`fdroidrepos://${url#https://}?fingerprint=$fp\` or ${url}?fingerprint=$fp"
            echo
            echo "The release has these in \`fdroid.txt\` and the link as a QR code in \`fdroid-qr.png\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: F-Droid repository failed
        if: env.RELEASE == 'true' && steps.fdroid.outcome == 'failure'
        run: |
          printf '### F-Droid repository\n\nNot updated: building it failed (see the step "F-Droid repository").\n' >> "$GITHUB_STEP_SUMMARY"

  # links to the executables in the run summary, once the builds are done
