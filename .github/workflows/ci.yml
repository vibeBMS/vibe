name: CI

on:
  push:
    # Dependabot's branches run as pull requests (and publish no web preview);
    # fdroid-repo is the F-Droid repository the nightly job publishes; e2e/
    # branches try the comparison tests (e2e.yml) and run only those
    branches-ignore: ['dependabot/**', 'fdroid-repo', 'e2e/**']
  pull_request:
  workflow_dispatch:

# what a job's token may do, whatever the repository's default is: read the
# repository. The jobs that need more say so (cache-prune, pages, nightly).
permissions:
  contents: read

# A newer commit on the same branch or pull request cancels the older run:
# hosted runners are limited (20 jobs, 5 of them macOS, across the
# organization), and only the newest commit's builds matter. A publish cut
# off this way is redone by the newer run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The release builds run tools/build_release.sh, which makes them
# reproducible (docs/BUILDING.md, "Reproducible builds"): the same commit and
# run number give the same bytes, which tools/reproduce.sh and the
# Reproducible builds workflow check. It also gives nightlies thin LTO over 16
# codegen units instead of the release profile's fat LTO in one unit:
# dependencies come from the cache, but fat LTO re-optimises the whole program
# single-threaded on every build (most of each build job's minutes); thin LTO
# is a few times faster to link and costs a few percent at run time. A stable
# release keeps the profile's.
env:
  CARGO_TERM_COLOR: always

jobs:
  # Only the default branch's newest cache of each job stays:
  # other refs' entries and the default branch's older ones (left when
  # Cargo.lock, the toolchain or go.sum changed) are deleted, so the
  # repository's 10 GB hold one set. It runs first, beside the builds, so a
  # newer push cancelling this run does not skip it, and the space is free
  # before this run saves. A replaced key stays until the next push: it is
  # what this run's jobs restore from.
  cache-prune:
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAIN: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          # rust-cache: v0-rust-<key>-<job>-<os>-<arch>-<environment>-<lockfiles>;
          # setup-go: setup-go-<os>-<arch>-<image>-go-<version>-<go.sum hash>;
          # gradle-<os>-<arch>-<version>-<build files hash>; gradle-<version>
          # (setup-gradle's distribution, saved even with its caching off);
          # noto-cjk-<commit>;
          # flatpak-platform-<arch>-<runtime>: the one of each kind used last
          # stays;
          # e2e-*: the comparison tests' downloads (LR2, beatoraja), kept on
          # every ref; any other key: only other refs' entries
          gh cache list --limit 1000 --sort last_accessed_at --order desc \
            --json id,key,ref,sizeInBytes --jq '.[] | "\(.id)\t\(.key)\t\(.ref)\t\(.sizeInBytes)"' |
            awk -F'\t' -v main="$MAIN" '{
              job = $2
              if (job ~ /^e2e-/) next
              # (the entries setup-gradle made before Gradle had one cache entry)
              if (job ~ /^gradle-[a-z-]+-v1[-|]/) { print $1 "\t" $2 "\t" $3 "\t" int($4 / 1048576) " MB"; next }
              # (and the pins hash in the key, so caches of older pins go too)
              if (job ~ /^v0-rust-/) { sub(/-[0-9a-f]+-[0-9a-f]+$/, "", job); sub(/-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]-/, "-", job) }
              else if (job ~ /^setup-go-/) sub(/-[0-9a-f]+$/, "", job)
              else if (job ~ /^gradle-[0-9][0-9.]*$/) job = "gradle-distribution"
              else if (job ~ /^gradle-/) sub(/-[^-]+-[0-9a-f]*$/, "", job)
              else if (job ~ /^noto-cjk-/) job = "noto-cjk"
              else if (match(job, /^flatpak-platform-[A-Za-z0-9]+-/)) job = substr(job, 1, RLENGTH)
              if ($3 != main || (job != $2 && seen[job]++)) print $1 "\t" $2 "\t" $3 "\t" int($4 / 1048576) " MB"
            }' |
            while IFS=$'\t' read -r id key ref size; do
              echo "delete $key ($ref, $size)"
              gh cache delete "$id"
            done

  # the container images and runner labels of tools/repro.env (the jobs take
  # them from here: a job's container and runner cannot read a file), and for
  # each build a short hash of its pins, in its cache key: Cargo does not see
  # a new C compiler, so the C its build scripts compiled with the old one
  # would be kept from the cache
  pins:
    name: pinned build environment
    runs-on: ubuntu-latest
    outputs:
      portable-x64: ${{ steps.pins.outputs.portable-x64 }}
      portable-arm64: ${{ steps.pins.outputs.portable-arm64 }}
      web: ${{ steps.pins.outputs.web }}
      linux-x64: ${{ steps.pins.outputs.linux-x64 }}
      linux-arm64: ${{ steps.pins.outputs.linux-arm64 }}
      macos: ${{ steps.pins.outputs.macos }}
      windows: ${{ steps.pins.outputs.windows }}
      key-linux: ${{ steps.pins.outputs.key-linux }}
      key-portable: ${{ steps.pins.outputs.key-portable }}
      key-web: ${{ steps.pins.outputs.key-web }}
      key-macos: ${{ steps.pins.outputs.key-macos }}
      key-windows: ${{ steps.pins.outputs.key-windows }}
      key-android: ${{ steps.pins.outputs.key-android }}
      source-date-epoch: ${{ steps.pins.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/repro.env
            tools/linux-arm64.lock
          sparse-checkout-cone-mode: false
      - id: pins
        run: |
          . tools/repro.env
          key() { printf '%s\n' "$@" | sha256sum | cut -c1-8; }
          {
            echo "portable-x64=$PORTABLE_IMAGE_X64"
            echo "portable-arm64=$PORTABLE_IMAGE_ARM64"
            echo "web=$WEB_IMAGE"
            echo "linux-x64=$LINUX_IMAGE_X64"
            echo "linux-arm64=$LINUX_IMAGE_ARM64"
            echo "macos=$MACOS_RUNNER"
            echo "windows=$WINDOWS_RUNNER"
            echo "key-linux=$(key "$LINUX_IMAGE_X64" "$LINUX_IMAGE_ARM64" "$UBUNTU_SNAPSHOT" "$LINUX_PACKAGES" "$(cat tools/linux-arm64.lock)")"
            echo "key-portable=$(key "$PORTABLE_IMAGE_X64" "$PORTABLE_IMAGE_ARM64" "$PORTABLE_PACKAGES")"
            echo "key-web=$(key "$WEB_IMAGE" "$UBUNTU_SNAPSHOT" "$WEB_PACKAGES")"
            echo "key-macos=$(key "$MACOS_RUNNER" "$XCODE_VERSION")"
            echo "key-windows=$(key "$WINDOWS_RUNNER" "$MSVC_COMPONENT" "$WINDOWS_SDK")"
            echo "key-android=$(key "$NDK_VERSION" "$CARGO_NDK_VERSION")"
            # the commit's time, for the jobs whose checkout has no git (macos-dmg)
            echo "source-date-epoch=$(git log -1 --format=%ct)"
          } | tee -a "$GITHUB_OUTPUT"

  test:
    name: test (lint + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apt
        with:
          packages: libasound2-dev libudev-dev libwebkit2gtk-4.1-dev
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy
          stamp: "false"
      # the built-in skins committed are what their generator makes, with
      # the Pillow (its FreeType) and the Inter faces they were made with:
      # another Inter version moves every glyph
      - name: built-in skins up to date
        run: |
          deb=fonts-inter_4.0+ds-1_all.deb
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$deb" "http://archive.ubuntu.com/ubuntu/pool/universe/f/fonts-inter/$deb"
          echo "d1ca9cc3e26c347bd31977d4693bf6c371ee6b81a711e092923c8160c02e88ce  $RUNNER_TEMP/$deb" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/$deb" "$RUNNER_TEMP/inter"
          python3 -m venv "$RUNNER_TEMP/skins"
          "$RUNNER_TEMP/skins/bin/pip" install -q pillow==12.3.0
          "$RUNNER_TEMP/skins/bin/python" tools/gen_default_skins.py --check \
            --fonts "$RUNNER_TEMP/inter/usr/share/fonts/opentype/inter"
      # the checks the Toolchain pins workflow makes of what it found, which
      # updates the Dependabot merge workflow holds, and how latest.json is
      # signed and checked (sign-update, verify-update)
      - run: python3 tools/repro_pins_test.py
      - run: python3 .github/dependabot_merge_test.py
      - run: python3 .github/update_signing_test.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # lint the code other targets compile (cfg'd out on Linux) in minutes,
  # before the release builds; iOS needs a Mac: its build job covers it
  cross-check:
    name: cross-check (wasm32, android)
    needs: pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android
          components: clippy
          cache-key: cross-check-${{ needs.pins.outputs.key-android }}
          stamp: "false"
      # Lua is compiled from C for the web: clang with the WebAssembly target
      - run: clang --version
      # the runner may have only versioned llvm-ar-NN
      - run: echo "AR_wasm32_unknown_unknown=$(command -v llvm-ar || ls /usr/bin/llvm-ar-* | sort -V | tail -1)" >> "$GITHUB_ENV"
      - run: cargo clippy -p vibebms -p vibebms-web -p vibebms-lua-web --lib --target wasm32-unknown-unknown -- -D warnings
      # the NDK and cargo-ndk the APK is built with
      - uses: ./.github/actions/android-setup
        with:
          tools: ndk
      - run: cargo ndk -t arm64-v8a --platform 26 clippy -p vibebms -p vibebms-android -- -D warnings

  # each Linux executable with the in-app browser, then the same executable as
  # a Flatpak. One job per architecture, on the Ubuntu 22.04 runner:
  # - the executable is built in the pinned Ubuntu 22.04 image (glibc 2.35
  #   and WebKitGTK 4.1, the oldest base that has it: Ubuntu 22.04, Debian 12
  #   and newer; `build-linux-portable` has the rest), its packages from the
  #   Ubuntu snapshot (x64) or as tools/linux-arm64.lock lists them (arm64:
  #   the ports archive has no snapshot) (the image by digest and the
  #   packages: tools/repro.env; tools/reproduce.sh builds the same). Only
  #   that step runs in it (docker run), with the runner's Rust, CARGO_HOME
  #   and target folder mounted where they are, so rust-cache restores and
  #   saves them as for any build;
  # - the Flatpak is packaged on the runner (as it is, on the GNOME runtime,
  #   which has WebKitGTK 4.1; a bundle per architecture, as a bundle holds
  #   one: tools/package_flatpak.sh, platform/flatpak): bubblewrap needs the
  #   host's user namespaces. The executable's artifact is uploaded before
  #   the Flatpak steps, which do not fail the job, so the nightly has the
  #   executable either way and the caches are saved.
  build-linux:
    name: build ${{ matrix.name }}
    needs: [test, pins]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            loader: /lib64/ld-linux-x86-64.so.2
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            loader: /lib/ld-linux-aarch64.so.1
    runs-on: ${{ matrix.os }}
    # the SHA-256 of each file the job uploads (update-manifest and the
    # nightly job take only these files: any job of the run can upload an
    # artifact, but only this one sets these). The legs' outputs are one set:
    # each name is one leg's, and every other leg leaves it empty (an empty
    # output is not set, so it does not replace the other leg's value)
    outputs:
      sha256-linux-x64: ${{ matrix.name == 'linux-x64' && steps.sha256.outputs.sha256 || '' }}
      sha256-linux-arm64: ${{ matrix.name == 'linux-arm64' && steps.sha256.outputs.sha256 || '' }}
      sha256-linux-x64-flatpak: ${{ matrix.name == 'linux-x64' && steps.flatpak-sha256.outputs.sha256 || '' }}
      sha256-linux-arm64-flatpak: ${{ matrix.name == 'linux-arm64' && steps.flatpak-sha256.outputs.sha256 || '' }}
    env:
      # (rust-cache's: its cache is saved when only the Flatpak failed)
      CACHE_ON_FAILURE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apt
        with:
          # faketime: the bundle carries the time it is made, which it makes
          # the commit's (a reproducible bundle)
          packages: faketime
          # the Flatpak's (appstream-compose for `appstreamcli compose`),
          # without their Recommends (desktop portals, speech data: not needed
          # to package)
          packages-without-recommends: flatpak desktop-file-utils appstream appstream-compose
      # Rust on the runner, the cache, and the version, app id, name and
      # branch (tools/ci_version.sh; the Flatpak takes them too, e.g.
      # io.github.vibebms.nightly, "vibeBMS Nightly")
      - uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.name }}-${{ needs.pins.outputs.key-linux }}
      # in the pinned image: its packages as root (tools/build_deps.sh), then
      # tools/build_release.sh as the runner's user, so what it writes into the
      # mounted folders stays the runner's
      - name: build (in the pinned image)
        env:
          IMAGE: ${{ matrix.arch == 'x64' && needs.pins.outputs.linux-x64 || needs.pins.outputs.linux-arm64 }}
          ARTIFACT: ${{ matrix.name }}
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}" rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          USER_IDS="$(id -u):$(id -g)"
          export SOURCE_DATE_EPOCH USER_IDS
          # shellcheck disable=SC2016 # expanded in the container
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -v "$cargo_home:$cargo_home" -v "$rustup_home:$rustup_home" \
            -e CARGO_HOME="$cargo_home" -e RUSTUP_HOME="$rustup_home" -e HOME=/tmp/build-home \
            -e PATH="$cargo_home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            -e ARTIFACT -e USER_IDS -e SOURCE_DATE_EPOCH -e CARGO_TERM_COLOR \
            -e VIBEBMS_CHANNEL -e VIBEBMS_VERSION -e VIBEBMS_BASE_VERSION -e VIBEBMS_BUILD -e VIBEBMS_COMMIT \
            -e VIBEBMS_APP_ID -e VIBEBMS_APP_NAME \
            "$IMAGE" bash -c '
              set -euo pipefail
              tools/build_deps.sh "$ARTIFACT"
              mkdir -p "$HOME" && chown "$USER_IDS" "$HOME"
              exec setpriv --reuid="${USER_IDS%:*}" --regid="${USER_IDS#*:}" --clear-groups \
                tools/build_release.sh "$ARTIFACT"'
      # the version it was built with, for the nightly's latest.json
      - run: echo "$VIBEBMS_VERSION" > target/${{ matrix.target }}/release/version.txt
      - id: sha256
        run: echo "sha256=$(sha256sum < target/${{ matrix.target }}/release/vibebms | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"
      # the executable alone (the downloads job links it in the run summary)
      - uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/vibebms
            target/${{ matrix.target }}/release/version.txt
      - name: Flatpak runtime
        run: |
          # org.gnome.Platform//51, from the manifest
          echo "RUNTIME=$(grep -E '^(runtime|runtime-version):' platform/flatpak/vibebms.yml | tr -d "'" | cut -d' ' -f2 | paste -sd/ | sed 's|/|//|')" >> "$GITHUB_ENV"
          # Ubuntu 24.04 and newer deny unprivileged user namespaces to
          # programs without an AppArmor profile; `flatpak run`'s bubblewrap
          # (the check) needs them (22.04 may not have the setting)
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ "$(cat "$f" 2>/dev/null)" = 1 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # the runtime alone (about 430 MB from Flathub; the packaging needs
      # neither it nor the SDK, the check runs in it), installed for the user
      # by the first run with this runtime
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak
          key: flatpak-platform-${{ runner.arch }}-${{ env.RUNTIME }}
      # a failed Flatpak fails the job (after the executable's upload; the Rust
      # cache is saved all the same, CACHE_ON_FAILURE), so nothing is released
      # or published
      - id: flatpak
        continue-on-error: true
        run: tools/package_flatpak.sh target/${{ matrix.target }}/release/vibebms out
      # the bundle installs, and every library the executable links (WebKitGTK
      # 4.1 among them) is in the runtime. --no-related leaves out the runtime's
      # GL drivers, codecs and translations (another ~1 GB in the cache), which
      # the check does not need
      - name: check the Flatpak
        id: flatpak-check
        if: steps.flatpak.outcome == 'success'
        continue-on-error: true
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --no-related flathub "$RUNTIME"
          flatpak install --user --noninteractive --no-related out/vibeBMS-linux-${{ matrix.arch }}.flatpak
          flatpak run --command=${{ matrix.loader }} "$VIBEBMS_APP_ID" --list /app/bin/vibebms | tee out/libs.txt
          grep -q 'libwebkit2gtk-4\.1\.so.* => /' out/libs.txt
          ! grep 'not found' out/libs.txt
      - id: flatpak-sha256
        if: steps.flatpak-check.outcome == 'success'
        run: echo "sha256=$(sha256sum < out/vibeBMS-linux-${{ matrix.arch }}.flatpak | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"
      - if: steps.flatpak-check.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-linux-${{ matrix.arch }}-flatpak
          path: out/vibeBMS-linux-${{ matrix.arch }}.flatpak
      - if: steps.flatpak.outcome == 'failure' || steps.flatpak-check.outcome == 'failure'
        run: |
          echo "::error::the Flatpak (linux-${{ matrix.arch }}) failed: nothing is released or published"
          exit 1

  # on the pinned runner image, with its pinned MSVC toolset and Windows SDK
  # (tools/repro.env; tools/build_release.sh selects them through
  # vcvarsall.bat, adds the toolset's ARM64 tools with the Visual Studio
  # installer, which the image lacks, and stops if it cannot)
  build-windows:
    name: build ${{ matrix.name }}
    needs: [test, pins]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, target: aarch64-pc-windows-msvc }
    runs-on: ${{ needs.pins.outputs.windows }}
    # each leg's executable's SHA-256 under its own name (as build-linux's)
    outputs:
      sha256-windows-x64: ${{ matrix.name == 'windows-x64' && steps.sha256.outputs.sha256 || '' }}
      sha256-windows-arm64: ${{ matrix.name == 'windows-arm64' && steps.sha256.outputs.sha256 || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build
        with:
          name: ${{ matrix.name }}
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}-${{ needs.pins.outputs.key-windows }}
      # (the file the action has just uploaded, as it uploaded it)
      - id: sha256
        shell: bash
        run: echo "sha256=$(sha256sum < target/${{ matrix.target }}/release/vibebms.exe | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"

  # macOS: both architectures on one runner (x86_64 cross-built on the arm64
  # one), then the app: one universal executable in an ad-hoc signed bundle
  # (tools/package_macos.sh), as a .zip for the self-update; macos-dmg makes
  # the .dmg for people from that zip. One job, not three: macOS runners are
  # few, and jobs that waited too long for one were cancelled. On the pinned
  # runner image with its pinned Xcode (tools/repro.env; tools/build_release.sh
  # and tools/package_macos.sh select it and stop if the image lacks it).
  macos:
    name: build macOS (arm64, x64, universal app)
    needs: [test, pins]
    runs-on: ${{ needs.pins.outputs.macos }}
    # the SHA-256 of each file the job uploads, as build-linux's
    outputs:
      sha256-macos-arm64: ${{ steps.executables.outputs.sha256-arm64 }}
      sha256-macos-x64: ${{ steps.executables.outputs.sha256-x64 }}
      sha256-macos-universal: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          cache-key: macos-universal-${{ needs.pins.outputs.key-macos }}
      - run: tools/build_release.sh macos
      # each executable as the other builds give theirs (the nightly's
      # vibebms-macos-arm64 / -x64 and latest.json read these artifacts)
      - name: executables
        id: executables
        run: |
          for t in arm64:aarch64 x64:x86_64; do
            mkdir -p "art/vibeBMS-macos-${t%%:*}"
            cp "target/${t#*:}-apple-darwin/release/vibebms" "art/vibeBMS-macos-${t%%:*}/"
            echo "$VIBEBMS_VERSION" > "art/vibeBMS-macos-${t%%:*}/version.txt"
            echo "sha256-${t%%:*}=$(shasum -a 256 < "art/vibeBMS-macos-${t%%:*}/vibebms" | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-macos-arm64
          path: art/vibeBMS-macos-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-macos-x64
          path: art/vibeBMS-macos-x64
      - name: package
        id: package
        run: |
          mkdir out
          tools/package_macos.sh art/vibeBMS-macos-arm64/vibebms art/vibeBMS-macos-x64/vibebms out
          # the version the executables were built with, for latest.json
          echo "$VIBEBMS_VERSION" > out/version.txt
          echo "sha256=$(shasum -a 256 < out/vibebms-macos-universal.app.zip | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-macos-universal
          path: |
            out/vibebms-macos-universal.app.zip
            out/version.txt

  # the .dmg of the app's zip (tools/package_dmg.sh: an HFS+ volume with the
  # app and a link to /Applications, made with hfsprogs and libdmg-hfsplus,
  # its times and IDs pinned), on Linux in the pinned image with the pinned
  # packages and libdmg-hfsplus commit (tools/repro.env, tools/build_deps.sh
  # dmg): the same bytes from the same zip anywhere (tools/reproduce.sh makes
  # it again); macos-dmg-check then mounts it on macOS
  macos-dmg:
    name: build macOS .dmg
    needs: [pins, macos]
    runs-on: ubuntu-latest
    container: ${{ needs.pins.outputs.linux-x64 }}
    defaults:
      run:
        shell: bash
    outputs:
      # the .dmg's SHA-256: the nightly job publishes only this file
      sha256: ${{ steps.dmg.outputs.sha256 }}
    steps:
      # (the image has no git yet: the checkout is the commit's files)
      - uses: actions/checkout@v7
      - run: tools/build_deps.sh dmg
      - uses: actions/download-artifact@v8
        with:
          name: vibeBMS-macos-universal
          path: app
      # the app the macos job made, not one another job uploaded
      - env:
          ZIP_SHA256: ${{ needs.macos.outputs.sha256-macos-universal }}
        run: |
          f=app/vibebms-macos-universal.app.zip
          if [ ! -f "$f" ] || [ "$(sha256sum < "$f" | cut -d' ' -f1)" != "$ZIP_SHA256" ]; then
            echo "::error::the artifact vibeBMS-macos-universal is not the app the job macos made (its SHA-256 differs): no .dmg is made"
            exit 1
          fi
      - id: dmg
        run: |
          tools/package_dmg.sh app/vibebms-macos-universal.app.zip out
          echo "sha256=$(sha256sum < out/vibeBMS-macos-universal.dmg | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"
        env:
          SOURCE_DATE_EPOCH: ${{ needs.pins.outputs.source-date-epoch }}
      - uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-macos-dmg
          path: out/vibeBMS-macos-universal.dmg

  # the .dmg as people use it, on macOS: hdiutil verifies its checksums and
  # mounts it; the app in it is the zip's, its signature holds, and copied
  # out of it (to an Applications folder) it starts
  macos-dmg-check:
    name: check macOS .dmg
    needs: [pins, macos-dmg]
    runs-on: ${{ needs.pins.outputs.macos }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vibeBMS-macos-dmg
          path: dmg
      - uses: actions/download-artifact@v8
        with:
          name: vibeBMS-macos-universal
          path: app
      - run: |
          set -x
          dmg=dmg/vibeBMS-macos-universal.dmg
          hdiutil imageinfo "$dmg" | grep -E '^(Format|Checksum Type|Partitions):|partition-name|Apple_HFS' || true
          hdiutil verify "$dmg"
          mnt="$RUNNER_TEMP/mnt"
          mkdir "$mnt"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$dmg"
          ls -la "$mnt"
          diskutil info "$mnt" | grep -E 'Volume Name|File System Personality|Volume UUID' || true
          [ "$(readlink "$mnt/Applications")" = /Applications ]
          app="$(find "$mnt" -maxdepth 1 -name '*.app')"
          # the same app as the zip (codesign checks every file against its seal)
          mkdir zip && ditto -x -k app/vibebms-macos-universal.app.zip zip
          diff -r "zip/$(basename "$app")" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # installed as people do: copied out of the volume
          mkdir "$RUNNER_TEMP/Applications"
          ditto "$app" "$RUNNER_TEMP/Applications/$(basename "$app")"
          hdiutil detach "$mnt"
          installed="$RUNNER_TEMP/Applications/$(basename "$app")"
          codesign --verify --deep --strict --verbose=2 "$installed"
          "$installed/Contents/MacOS/vibebms" --help > help.txt
          head -5 help.txt

  # Linux without the download browser (no WebKitGTK / GTK), built against
  # glibc 2.28 in a manylinux_2_28 (AlmaLinux 8) container: it starts on
  # older and more distributions (RHEL 8, Debian 10, Ubuntu 20.04) and needs
  # only ALSA and libudev
  # (the image by digest: tools/repro.env, which names its packages too, at
  # the versions AlmaLinux 8 has that day; tools/reproduce.sh builds the same
  # in the same image)
  build-linux-portable:
    name: build ${{ matrix.name }}
    needs: [test, pins]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-portable, os: ubuntu-latest, arch: x64, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64-portable, os: ubuntu-24.04-arm, arch: arm64, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.arch == 'x64' && needs.pins.outputs.portable-x64 || needs.pins.outputs.portable-arm64 }}
    # each leg's executable's SHA-256 under its own name (as build-linux's)
    outputs:
      sha256-linux-x64-portable: ${{ matrix.name == 'linux-x64-portable' && steps.sha256.outputs.sha256 || '' }}
      sha256-linux-arm64-portable: ${{ matrix.name == 'linux-arm64-portable' && steps.sha256.outputs.sha256 || '' }}
    steps:
      - uses: actions/checkout@v7
      - run: tools/build_deps.sh ${{ matrix.name }}
      - uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.name }}-${{ needs.pins.outputs.key-portable }}
      # (it checks that the executable needs glibc 2.28 at most)
      - run: tools/build_release.sh ${{ matrix.name }}
      # the version it was built with, for the nightly's latest.json
      - run: echo "$VIBEBMS_VERSION" > target/${{ matrix.target }}/release/version.txt
        shell: bash
      - id: sha256
        shell: bash
        run: echo "sha256=$(sha256sum < target/${{ matrix.target }}/release/vibebms | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/vibebms
            target/${{ matrix.target }}/release/version.txt

  # in a pinned image with pinned packages (tools/repro.env): clang, which
  # compiles Lua into the module, is part of what makes the build
  web:
    name: build web (wasm32)
    needs: [test, pins]
    runs-on: ubuntu-latest
    container: ${{ needs.pins.outputs.web }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    outputs:
      # the build's SHA-256 (of the list of its files' SHA-256s and names):
      # the nightly job zips only this build
      sha256: ${{ steps.sha256.outputs.sha256 }}
    steps:
      # (the image has no git yet: the checkout is the commit's files, which is
      # all the build needs)
      - uses: actions/checkout@v7
      - run: tools/build_deps.sh web
      - uses: ./.github/actions/rust-setup
        with:
          targets: wasm32-unknown-unknown
          cache-key: web-${{ needs.pins.outputs.key-web }}
      - run: cargo install wasm-bindgen-cli --locked --version "$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | cut -d'"' -f2)"
      # the CJK fonts (about 25 MB from GitHub) from an earlier run, keyed by
      # the noto-cjk commit tools/build_release.sh pins (it checks each file's
      # hash and downloads it again if it is not the one it pins)
      - id: noto
        run: echo "commit=$(grep -o 'noto-cjk/[0-9a-f]\{40\}' tools/build_release.sh | head -1 | cut -c10-21)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            web/fonts/NotoSans*-Regular.otf
            web/fonts/NotoSansCJK-LICENSE.txt
          key: noto-cjk-${{ steps.noto.outputs.commit }}
      # web/pkg and the CJK fonts (Noto Sans CJK, SIL OFL 1.1, at a fixed
      # commit). Third parties' mirrors on by default: the repository variable
      # WEB_THIRD_PARTY=1 (Settings > Secrets and variables > Actions >
      # Variables), which a rebuild of the web build takes too
      - run: tools/build_release.sh web
        env:
          VIBEBMS_THIRD_PARTY: ${{ vars.WEB_THIRD_PARTY }}
      # a C function nothing defines becomes an import from "env", which
      # only fails when the page loads
      - name: no undefined imports
        run: node tools/check_wasm_imports.mjs web/pkg/vibebms_web_bg.wasm
      - name: the web build's SHA-256
        id: sha256
        run: |
          # the files as the artifact holds them (upload-artifact leaves out
          # hidden ones and follows links), as the nightly job's "files" step
          # reads them
          tree_sha256() (
            cd "$1"
            find -L . -name '.*' ! -name . -prune -o -type f -print | sed 's|^\./||' | LC_ALL=C sort |
              while IFS= read -r f; do printf '%s  %s\n' "$(sha256sum < "$f" | cut -d' ' -f1)" "$f"; done |
              sha256sum | cut -d' ' -f1
          )
          echo "sha256=$(tree_sha256 web)" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-web
          path: web
      # the default branch's build is the site (other branches' stay artifacts)
      - if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  # GitHub Pages (Settings > Pages > Source: GitHub Actions): each deploy
  # replaces the whole site with the default branch's web build, once every
  # build of the commit has passed (the site and the nightly then agree)
  pages:
    needs: [test, cross-check, build-linux, build-windows, build-linux-portable, macos, macos-dmg, macos-dmg-check, android, android-sign, ios, web, update-manifest, sign-update, verify-update]
    if: ${{ !failure() && !cancelled() && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # one deploy after another, none stopped half way
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # an unsigned .ipa: install it by signing it with your own Apple ID
  # (AltStore, Sideloadly) or a developer certificate
  ios:
    name: build iOS (unsigned)
    needs: [test, pins]
    # (the pinned image and Xcode, as the macOS build's)
    runs-on: ${{ needs.pins.outputs.macos }}
    outputs:
      # the .ipa's SHA-256: the nightly job publishes only this file
      sha256: ${{ steps.ipa.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          targets: aarch64-apple-ios
          cache-key: aarch64-apple-ios-${{ needs.pins.outputs.key-macos }}
      # the app (iOS 14 and later; each channel its own: io.github.vibebms.nightly,
      # "vibeBMS Nightly"), zipped as Payload/vibeBMS.app
      - run: tools/build_release.sh ios out
      - id: ipa
        run: echo "sha256=$(shasum -a 256 < out/vibeBMS-unsigned.ipa | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-ios-unsigned
          path: out/vibeBMS-unsigned.ipa

  # the APK, unsigned: this job has no key (android-sign signs it)
  android:
    name: build android (experimental)
    needs: [test, pins]
    runs-on: ubuntu-latest
    outputs:
      # the unsigned APK's SHA-256: android-sign signs only this file (any
      # job of the run can upload an artifact, but only this job sets this)
      sha256: ${{ steps.apk.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          targets: aarch64-linux-android,x86_64-linux-android
          cache-key: android-${{ needs.pins.outputs.key-android }}
      # the NDK, cargo-ndk, the JDK and Gradle of tools/repro.env
      - uses: ./.github/actions/android-setup
      # the Rust library into the Gradle project, then the APK (versionCode:
      # the run number; versionName: the version)
      - run: tools/build_release.sh android out
      - id: apk
        run: echo "sha256=$(sha256sum < out/vibeBMS-unsigned.apk | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"
      # (not named vibeBMS-*: it is no download, and the nightly job takes
      # the signed one)
      - uses: actions/upload-artifact@v7
        with:
          name: android-unsigned
          path: out/vibeBMS-unsigned.apk
          retention-days: 7

  # the APK signed, in a job of its own: the key is never where the build's
  # tools run (cargo and the crates' build scripts, Gradle and its plugins),
  # only beside the pinned build-tools' apksigner and apksigcopier
  # (tools/build_release.sh sign). Release APKs must be signed: with the
  # repository's key (the secrets ANDROID_KEYSTORE, the keystore in base64,
  # and ANDROID_KEYSTORE_PASSWORD) in a run of the default branch that is not
  # a pull request's, which alone has the `release` environment (docs/BUILDING.md,
  # "Android signing": the secrets can be the environment's, which other
  # branches cannot use); else with a throwaway key (the APK installs, but
  # cannot update one signed by another key)
  android-sign:
    name: sign android
    needs: android
    runs-on: ubuntu-latest
    environment: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'release' || '' }}
    env:
      OWN_KEY: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    outputs:
      # "repository" (ANDROID_KEYSTORE) or "throwaway": the nightly job
      # publishes the F-Droid repository only for the first, as an APK signed
      # by another key cannot update the installed one
      signing: ${{ steps.sign.outputs.signing }}
      # the signed APK's SHA-256: the nightly job publishes only this file
      sha256: ${{ steps.sign.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            .github/actions
      - uses: ./.github/actions/android-setup
        with:
          tools: sign
      - uses: actions/download-artifact@v8
        with:
          name: android-unsigned
          path: unsigned
      # the keystore is there for this step alone, and its password in no
      # other step's environment
      - name: sign
        id: sign
        shell: bash
        env:
          KEYSTORE_B64: ${{ env.OWN_KEY == 'true' && secrets.ANDROID_KEYSTORE || '' }}
          KEYSTORE_PASSWORD: ${{ env.OWN_KEY == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          UNSIGNED_SHA256: ${{ needs.android.outputs.sha256 }}
        run: |
          # the APK the android job built, not one another job uploaded
          if [ ! -f unsigned/vibeBMS-unsigned.apk ] ||
            [ "$(sha256sum < unsigned/vibeBMS-unsigned.apk | cut -d' ' -f1)" != "$UNSIGNED_SHA256" ]; then
            echo "::error::the artifact android-unsigned is not the APK the android job built (its SHA-256 differs): nothing is signed"
            exit 1
          fi
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            echo "signing=repository" >> "$GITHUB_OUTPUT"
          else
            KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$ks" -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD \
              -alias vibebms -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=vibeBMS"
            echo "signing=throwaway" >> "$GITHUB_OUTPUT"
          fi
          # the key's alias (a keystore made for cargo-apk has one key)
          alias="$(keytool -list -keystore "$ks" -storepass:env KEYSTORE_PASSWORD | grep -m1 PrivateKeyEntry | cut -d, -f1)"
          VIBEBMS_KEYSTORE="$ks" VIBEBMS_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" VIBEBMS_KEY_ALIAS="$alias" \
            tools/build_release.sh sign unsigned/vibeBMS-unsigned.apk out
          rm "$ks"
          echo "sha256=$(sha256sum < out/vibeBMS.apk | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: vibeBMS-android
          path: out/vibeBMS.apk

  # what the desktop executables' self-update reads (crates/vibebms/src/
  # update/, docs/BUILDING.md, "Self-update"): the release's version and, for
  # each executable, the version it was built with, its SHA-256 and size.
  # The nightly is released only when every build passed, so every entry is
  # this run's. Made before the nightly job so that sign-update signs what
  # the nightly publishes; it has no secret and reads only.
  update-manifest:
    name: latest.json
    needs: [build-linux, build-windows, build-linux-portable, macos]
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    outputs:
      base-version: ${{ steps.manifest.outputs.base-version }}
      version: ${{ steps.manifest.outputs.version }}
      # "true" when the repository has tools/update_key.pub: the builds
      # check latest.json's signature with it, so it is signed
      signed: ${{ steps.manifest.outputs.signed }}
      # latest.json's SHA-256: sign-update, verify-update and the nightly job
      # take only this file (any job of the run can upload an artifact, but
      # only this job sets this)
      sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            Cargo.toml
            tools/update_key.pub
          sparse-checkout-cone-mode: false
      # (each artifact in a folder of its own: the step below takes only the
      # files it names)
      - uses: actions/download-artifact@v8
        with:
          pattern: vibeBMS-*
          path: art
      - name: write latest.json
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # (the builds' SHA-256 outputs)
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # the version the builds were given (tools/ci_version.sh)
          base="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2 | sed 's/[-+].*//')"
          VERSION="$base-nightly.$GITHUB_RUN_NUMBER+${GITHUB_SHA:0:7}"
          signed=false
          [ -f tools/update_key.pub ] && signed=true
          {
            echo "base-version=$base"
            echo "version=$VERSION"
            echo "signed=$signed"
          } | tee -a "$GITHUB_OUTPUT"
          # the executables, named as the nightly job's "files" step names them;
          # this job runs only when every build passed, so each is there. Each
          # is the file whose SHA-256 the job that built it gave as its output
          # sha256-<artifact> (any job of the run can upload an artifact, but
          # only that job sets its outputs)
          mkdir out
          take() { # <artifact> <file> <name> <job>
            local sha
            sha="$(jq -r --arg job "$4" --arg out "sha256-$1" '.[$job].outputs[$out] // ""' <<< "$NEEDS")"
            if [ ! -f "art/vibeBMS-$1/$2" ]; then
              echo "::error::the artifact vibeBMS-$1 has no $2"
              exit 1
            fi
            if [ -z "$sha" ] || [ "$(sha256sum < "art/vibeBMS-$1/$2" | cut -d' ' -f1)" != "$sha" ]; then
              echo "::error::the artifact vibeBMS-$1 is not the build the job $4 made (its $2's SHA-256 differs): no latest.json is written"
              exit 1
            fi
            cp "art/vibeBMS-$1/$2" "out/$3"
          }
          for t in linux-x64 linux-arm64; do
            take "$t" vibebms "vibebms-$t" build-linux
          done
          for t in linux-x64-portable linux-arm64-portable; do
            take "$t" vibebms "vibebms-$t" build-linux-portable
          done
          for t in macos-arm64 macos-x64; do
            take "$t" vibebms "vibebms-$t" macos
          done
          for t in windows-x64 windows-arm64; do
            take "$t" vibebms.exe "vibebms-$t.exe" build-windows
          done
          take macos-universal vibebms-macos-universal.app.zip vibebms-macos-universal.app.zip macos
          new='{}'
          for f in out/vibebms-*; do
            name="${f#out/}"
            t="${name#vibebms-}"
            t="${t%.exe}"
            t="${t%.app.zip}"
            v="$VERSION"
            [ -s "art/vibeBMS-$t/version.txt" ] && v="$(tr -d '[:space:]' < "art/vibeBMS-$t/version.txt")"
            new="$(jq -c --arg n "$name" --arg v "$v" \
              --arg sha "$(sha256sum "$f" | cut -d' ' -f1)" --argjson size "$(stat -c %s "$f")" \
              '. + {($n): {version: $v, sha256: $sha, size: $size}}' <<< "$new")"
          done
          # a part per channel: this job writes "nightly". The others
          # ("stable", for the releases to come) are kept from the release's
          # latest.json only when its signature verifies with
          # tools/update_key.pub (as verify-update checks it) and each has the
          # shape the builds read; else there are none. What is kept is signed
          # again, so nothing that this key did not sign before is kept.
          mkdir -p prev
          keep=false
          if [ "$signed" = true ] && gh release download nightly -p latest.json -D prev --clobber 2>/dev/null &&
            gh release download nightly -p latest.json.sig -D prev --clobber 2>/dev/null; then
            allowed="$RUNNER_TEMP/allowed_signers"
            printf 'vibebms-update namespaces="vibebms-update" %s\n' "$(cat tools/update_key.pub)" > "$allowed"
            if ssh-keygen -Y verify -f "$allowed" -I vibebms-update -n vibebms-update \
              -s prev/latest.json.sig < prev/latest.json && jq -e 'type == "object"' prev/latest.json > /dev/null; then
              keep=true
            fi
          fi
          [ "$keep" = true ] || echo "the release has no latest.json signed with tools/update_key.pub: no other channel is kept"
          [ "$keep" = true ] || echo '{}' > prev/latest.json
          jq --arg version "$VERSION" --argjson new "$new" '
            def entry: type == "object" and (.version | type) == "string"
              and (.sha256 | type) == "string" and (.sha256 | test("^[0-9a-fA-F]{64}$"))
              and (.size | type) == "number" and .size >= 1 and .size == (.size | floor) and .size < 9007199254740992;
            def channel: type == "object" and (.version | type) == "string"
              and (.files | type) == "object" and all(.files[]; entry);
            (if (.channels | type) == "object" then .channels else {} end)
            | with_entries(select(.key != "nightly" and (.value | channel))) as $kept
            | {channels: ($kept + {nightly: {version: $version, files: $new}})}
          ' prev/latest.json > out/latest.json
          cat out/latest.json
          echo "sha256=$(sha256sum < out/latest.json | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: update-manifest
          path: out/latest.json
          if-no-files-found: error

  # latest.json signed with the update key (an OpenSSH Ed25519 key, the
  # secret UPDATE_SIGNING_KEY of the environment `update-signing`;
  # docs/BUILDING.md, "Self-update"), in a job of its own that runs nothing
  # of the repository's: no checkout, no action but the artifacts' own, and
  # the runner's ssh-keygen. The key exists for the one step, and the
  # environment is this job's alone: no job that runs a script or a
  # downloaded tool (the nightly's, in `release`) is given the key. It signs
  # only the latest.json whose SHA-256 update-manifest gave. Without
  # tools/update_key.pub in the repository it does nothing, and latest.json
  # is published unsigned, as the builds without a key expect.
  sign-update:
    name: sign latest.json
    needs: update-manifest
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    environment: update-signing
    outputs:
      # latest.json.sig's SHA-256: verify-update checks this file, and the
      # nightly job publishes only it
      sha256: ${{ steps.sign.outputs.sha256 }}
    steps:
      - if: needs.update-manifest.outputs.signed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: update-manifest
          path: manifest
      - name: sign latest.json
        id: sign
        env:
          SIGNED: ${{ needs.update-manifest.outputs.signed }}
          MANIFEST_SHA256: ${{ needs.update-manifest.outputs.sha256 }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ "$SIGNED" != true ]; then
            echo "the repository has no tools/update_key.pub: latest.json is published unsigned"
            exit 0
          fi
          if [ ! -f manifest/latest.json ] ||
            [ "$(sha256sum < manifest/latest.json | cut -d' ' -f1)" != "$MANIFEST_SHA256" ]; then
            echo "::error::the artifact update-manifest is not the latest.json the job update-manifest made (its SHA-256 differs): nothing is signed or published"
            exit 1
          fi
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::tools/update_key.pub is in the repository, but the environment update-signing has no secret UPDATE_SIGNING_KEY (docs/BUILDING.md, \"Self-update\"): nothing is published"
            exit 1
          fi
          key="$RUNNER_TEMP/update-key"
          trap 'rm -f "$key"' EXIT
          # (a key pasted from Windows has CR LF line ends, which ssh-keygen refuses)
          (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" | tr -d '\r' > "$key")
          rm -f manifest/latest.json.sig
          ssh-keygen -q -Y sign -n vibebms-update -f "$key" manifest/latest.json < /dev/null
          echo "sha256=$(sha256sum < manifest/latest.json.sig | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: needs.update-manifest.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: update-signature
          path: manifest/latest.json.sig
          if-no-files-found: error

  # the signature checked, before anything is published, against the key
  # the builds have (tools/update_key.pub), in a job without the secret: a
  # key that is not the committed one's pair would publish a latest.json
  # that no build takes. The files checked are the ones update-manifest and
  # sign-update made (their SHA-256 outputs), which the nightly job publishes.
  verify-update:
    name: check latest.json's signature
    needs: [update-manifest, sign-update]
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: tools/update_key.pub
          sparse-checkout-cone-mode: false
      - if: hashFiles('tools/update_key.pub') != ''
        uses: actions/download-artifact@v8
        with:
          name: update-manifest
          path: manifest
      - if: hashFiles('tools/update_key.pub') != ''
        uses: actions/download-artifact@v8
        with:
          name: update-signature
          path: manifest
      - name: check the signature
        env:
          MANIFEST_SHA256: ${{ needs.update-manifest.outputs.sha256 }}
          SIGNATURE_SHA256: ${{ needs.sign-update.outputs.sha256 }}
        run: |
          if [ ! -f tools/update_key.pub ]; then
            echo "the repository has no tools/update_key.pub: latest.json is not signed"
            exit 0
          fi
          for f in latest.json:"$MANIFEST_SHA256":update-manifest latest.json.sig:"$SIGNATURE_SHA256":sign-update; do
            IFS=: read -r name sha job <<< "$f"
            if [ ! -f "manifest/$name" ] || [ "$(sha256sum < "manifest/$name" | cut -d' ' -f1)" != "$sha" ]; then
              echo "::error::$name is not the one the job $job made (its SHA-256 differs): nothing is published"
              exit 1
            fi
          done
          allowed="$RUNNER_TEMP/allowed_signers"
          printf 'vibebms-update namespaces="vibebms-update" %s\n' "$(cat tools/update_key.pub)" > "$allowed"
          if ! ssh-keygen -Y verify -f "$allowed" -I vibebms-update -n vibebms-update \
            -s manifest/latest.json.sig < manifest/latest.json; then
            echo "::error::latest.json's signature does not verify with tools/update_key.pub (is UPDATE_SIGNING_KEY its private key?): nothing is published"
            exit 1
          fi

  # the "nightly" prerelease: the default branch's latest builds, each file
  # as it is (no zip but the web build's), published only when every build
  # passed. Of the artifacts it takes only the files it names, and only the
  # ones the jobs that made them gave as their SHA-256 (the "check the files"
  # steps).
  # The run's downloads (a summary with each build's artifact link, on every
  # run) and, for a push to the default branch, the rolling nightly release
  # (or a run started by hand on it: Actions > CI > Run workflow, e.g. after
  # commits that skip CI)
  nightly:
    name: downloads & nightly
    needs: [test, cross-check, build-linux, build-windows, build-linux-portable, macos, macos-dmg, macos-dmg-check, android, android-sign, ios, web, update-manifest, sign-update, verify-update]
    if: always()
    runs-on: ubuntu-latest
    # (the F-Droid repository's key, as android-sign's)
    environment: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'release' || '' }}
    env:
      # released only when every build passed (the Flatpaks included); the
      # downloads summary is written either way
      RELEASE: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
    # a newer push's release wins over an older one still uploading (only
    # releases share the group: other runs must not cancel them)
    concurrency:
      group: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'nightly-release' || format('downloads-{0}', github.run_id) }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: write
    steps:
      - name: links
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Downloads"
            echo
            echo "| build | |"
            echo "|---|---|"
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate \
              --jq '.artifacts[] | select(.name | test("^vibeBMS-(linux|windows|macos|android|ios-unsigned)")) | "\(.name)\t\(.id)\t\(.size_in_bytes)"' |
              sort | while IFS=$'\t' read -r name id size; do
                echo "| ${name#vibeBMS-} | [download]($RUN/artifacts/$id) ($((size / 1048576)) MB) |"
              done
            echo
            echo "Linux / macOS: \`chmod +x vibebms\` after unzipping; on macOS also \`xattr -d com.apple.quarantine vibebms\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8
        if: env.RELEASE == 'true'
        with:
          pattern: vibeBMS-*
          path: art
      # the scripts (the web build's zip, the F-Droid repository), and the
      # commit's time for the zip
      - uses: actions/checkout@v7
        if: env.RELEASE == 'true'
        with:
          path: src
          persist-credentials: false
          sparse-checkout: |
            tools
            platform/android/fdroid
            assets/logo
      # the version the builds were given (tools/ci_version.sh)
      - name: version
        if: env.RELEASE == 'true'
        env:
          BASE: ${{ needs.update-manifest.outputs.base-version }}
          FULL: ${{ needs.update-manifest.outputs.version }}
        run: |
          echo "BASE_VERSION=$BASE" >> "$GITHUB_ENV"
          echo "VERSION=$FULL" >> "$GITHUB_ENV"
      # latest.json (update-manifest) and, when the repository has
      # tools/update_key.pub, its signature (sign-update), which verify-update
      # checked
      - uses: actions/download-artifact@v8
        if: env.RELEASE == 'true'
        with:
          name: update-manifest
          path: update
      - uses: actions/download-artifact@v8
        if: env.RELEASE == 'true' && needs.update-manifest.outputs.signed == 'true'
        with:
          name: update-signature
          path: update
      # the files to publish, in out/; what this step makes of them (the web
      # build's zip, altstore.json) it gives as its SHA-256 outputs, for the
      # check below
      - name: files
        id: files
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WEB_SHA256: ${{ needs.web.outputs.sha256 }}
        run: |
          mkdir out
          for t in linux-x64 linux-arm64 linux-x64-portable linux-arm64-portable macos-arm64 macos-x64; do
            [ -f "art/vibeBMS-$t/vibebms" ] && cp "art/vibeBMS-$t/vibebms" "out/vibebms-$t"
          done
          for t in windows-x64 windows-arm64; do
            [ -f "art/vibeBMS-$t/vibebms.exe" ] && cp "art/vibeBMS-$t/vibebms.exe" "out/vibebms-$t.exe"
          done
          f=vibebms-macos-universal.app.zip
          [ -f "art/vibeBMS-macos-universal/$f" ] && cp "art/vibeBMS-macos-universal/$f" "out/$f"
          f=vibeBMS-macos-universal.dmg
          [ -f "art/vibeBMS-macos-dmg/$f" ] && cp "art/vibeBMS-macos-dmg/$f" "out/$f"
          for a in x64 arm64; do
            f="vibeBMS-linux-$a.flatpak"
            [ -f "art/vibeBMS-linux-$a-flatpak/$f" ] && cp "art/vibeBMS-linux-$a-flatpak/$f" "out/$f"
          done
          [ -f art/vibeBMS-android/vibeBMS.apk ] && cp art/vibeBMS-android/vibeBMS.apk out/vibeBMS.apk
          [ -f art/vibeBMS-ios-unsigned/vibeBMS-unsigned.ipa ] && cp art/vibeBMS-ios-unsigned/vibeBMS-unsigned.ipa out/vibeBMS-unsigned.ipa
          # the same zip as tools/reproduce.sh makes of its web build, of the
          # build the web job made (its files as that job's "the web build's
          # SHA-256" lists them)
          if [ -d art/vibeBMS-web ]; then
            tree_sha256() (
              cd "$1"
              find -L . -name '.*' ! -name . -prune -o -type f -print | sed 's|^\./||' | LC_ALL=C sort |
                while IFS= read -r f; do printf '%s  %s\n' "$(sha256sum < "$f" | cut -d' ' -f1)" "$f"; done |
                sha256sum | cut -d' ' -f1
            )
            if [ "$(tree_sha256 art/vibeBMS-web)" != "$WEB_SHA256" ]; then
              echo "::error::the artifact vibeBMS-web is not the build the job web made (its SHA-256 differs): nothing is published"
              exit 1
            fi
            SOURCE_DATE_EPOCH="$(git -C src log -1 --format=%ct)" \
              src/tools/build_release.sh zip out/vibeBMS-web.zip art/vibeBMS-web
            echo "web-zip=$(sha256sum < out/vibeBMS-web.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi
          # an AltStore / SideStore source: add its URL once, and the app
          # store offers each new nightly .ipa as an update
          if [ -f out/vibeBMS-unsigned.ipa ]; then
            jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "${GITHUB_SHA:0:7}" \
              --arg version "$BASE_VERSION" --arg build "$GITHUB_RUN_NUMBER" --arg full "$VERSION" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson size "$(stat -c %s out/vibeBMS-unsigned.ipa)" '{
              name: "vibeBMS",
              identifier: "io.github.vibebms.source",
              website: "https://github.com/\($repo)",
              apps: [{
                name: "vibeBMS Nightly",
                bundleIdentifier: "io.github.vibebms.nightly",
                developerName: "vibeBMS",
                subtitle: "BMS player",
                localizedDescription: "A cross-platform BMS player. Nightly builds of the default branch.",
                iconURL: "https://raw.githubusercontent.com/\($repo)/main/platform/ios/AppIcon76x76@2x.png",
                tintColor: "#3B82F6",
                category: "games",
                versions: [{
                  version: $version,
                  buildVersion: $build,
                  date: $date,
                  localizedDescription: "Nightly build \($full).",
                  downloadURL: "https://github.com/\($repo)/releases/download/nightly/vibeBMS-unsigned.ipa",
                  size: $size,
                  minOSVersion: "14.0"
                }],
                appPermissions: { entitlements: [], privacy: {} }
              }],
              news: []
            }' > out/altstore.new.json
            # the nightly is one app of the source: the others (a stable one,
            # for the releases to come) are kept from the previous source
            mkdir -p prev
            if ! gh release download nightly -p altstore.json -D prev --clobber 2>/dev/null \
              || ! jq -e '.apps | type == "array"' prev/altstore.json >/dev/null 2>&1; then
              echo '{"apps": []}' > prev/altstore.json
            fi
            jq --slurpfile prev prev/altstore.json '
              (.apps[0].bundleIdentifier) as $id
              | (.apps[0].versions[0].downloadURL) as $url
              | .apps += [$prev[0].apps[]
                  | select(.bundleIdentifier != $id and ((.versions[0].downloadURL // "") != $url))]
            ' out/altstore.new.json > out/altstore.json
            rm out/altstore.new.json
            echo "altstore=$(sha256sum < out/altstore.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi
          for f in latest.json latest.json.sig; do
            [ ! -f "update/$f" ] || cp "update/$f" out/
          done
          ls -l out
      # each file in out/ is the one its maker gave as its SHA-256 output: a
      # job (any job of the run can upload an artifact, but only that job sets
      # its outputs) or a step of this job, which made it of such a file. A
      # file that no maker names stops the release too. Before anything is
      # signed (the F-Droid index) or published; the same check runs again
      # right before the upload ("check the files again")
      - name: check the files
        if: env.RELEASE == 'true'
        env: &check-files-env
          NEEDS: ${{ toJSON(needs) }}
          STEPS: ${{ toJSON(steps) }}
        run: &check-files |
          declare -A want who optional
          row() { want[$1]="$2"; who[$1]="$3"; optional[$1]="${4:-}"; } # <file> <SHA-256> <maker> [optional]
          job() { jq -r --arg j "$1" --arg o "$2" '.[$j].outputs[$o] // ""' <<< "$NEEDS"; }
          step() { jq -r --arg s "$1" --arg o "$2" '.[$s].outputs[$o] // ""' <<< "$STEPS"; }
          for t in linux-x64 linux-arm64; do
            row "vibebms-$t" "$(job build-linux "sha256-$t")" "the job build-linux"
            row "vibeBMS-$t.flatpak" "$(job build-linux "sha256-$t-flatpak")" "the job build-linux"
          done
          for t in linux-x64-portable linux-arm64-portable; do
            row "vibebms-$t" "$(job build-linux-portable "sha256-$t")" "the job build-linux-portable"
          done
          for t in windows-x64 windows-arm64; do
            row "vibebms-$t.exe" "$(job build-windows "sha256-$t")" "the job build-windows"
          done
          for t in macos-arm64 macos-x64; do
            row "vibebms-$t" "$(job macos "sha256-$t")" "the job macos"
          done
          row vibebms-macos-universal.app.zip "$(job macos sha256-macos-universal)" "the job macos"
          row vibeBMS-macos-universal.dmg "$(job macos-dmg sha256)" "the job macos-dmg"
          row vibeBMS-unsigned.ipa "$(job ios sha256)" "the job ios"
          row vibeBMS.apk "$(job android-sign sha256)" "the job android-sign"
          row latest.json "$(job update-manifest sha256)" "the job update-manifest"
          [ "$(job update-manifest signed)" != true ] ||
            row latest.json.sig "$(job sign-update sha256)" "the job sign-update"
          row vibeBMS-web.zip "$(step files web-zip)" "this job's step files (of the job web's build)"
          row altstore.json "$(step files altstore)" "this job's step files"
          # (made after the first check, and fdroid.txt only when the F-Droid
          # repository is built)
          row builds.json "$(step builds sha256)" "this job's step builds.json" optional
          row fdroid.txt "$(step fdroid sha256-txt)" "this job's step F-Droid repository" optional
          row fdroid-qr.png "$(step fdroid sha256-qr)" "this job's step F-Droid repository" optional
          bad=false
          refuse() { echo "::error::$1: nothing is published"; bad=true; }
          for name in $(printf '%s\n' "${!want[@]}" | LC_ALL=C sort); do
            f="out/$name"
            if [ -n "${want[$name]}" ]; then
              [ -f "$f" ] && [ ! -L "$f" ] && [ "$(sha256sum < "$f" | cut -d' ' -f1)" = "${want[$name]}" ] ||
                refuse "$name is not the one ${who[$name]} made (its SHA-256 differs)"
            elif [ -z "${optional[$name]}" ] || [ -e "$f" ] || [ -L "$f" ]; then
              refuse "$name is not the one ${who[$name]} made (it gave no SHA-256)"
            fi
          done
          shopt -s nullglob dotglob
          for f in out/*; do
            [ -n "${want[${f#out/}]+x}" ] || refuse "${f#out/} is not the file of any job (none gives its SHA-256)"
          done
          [ "$bad" = false ]
      # every published build's executables, for IR operators who accept a
      # client by its executable's SHA-256 (docs/BUILDING.md,
      # crates/vibebms/src/ir/build_id.rs): appended to the previous
      # builds.json, nightlies kept 90 days (500 at most), releases always.
      # Files inside a package are hashed as they run: the macOS app's
      # executable and the Android libraries.
      - name: builds.json
        id: builds
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p prev
          if ! gh release download nightly -p builds.json -D prev --clobber 2>/dev/null \
            || ! jq -e '.builds | type == "array"' prev/builds.json >/dev/null 2>&1; then
            echo '{"builds": []}' > prev/builds.json
          fi
          files='{}'
          add() { # <name> <file>
            files="$(jq -c --arg n "$1" --arg sha "$(sha256sum "$2" | cut -d' ' -f1)" \
              --argjson size "$(stat -c %s "$2")" '. + {($n): {sha256: $sha, size: $size}}' <<< "$files")"
          }
          for f in out/vibebms-linux-* out/vibebms-macos-arm64 out/vibebms-macos-x64 out/vibebms-windows-*.exe; do
            [ -f "$f" ] && add "${f#out/}" "$f"
          done
          inner="$(mktemp)"
          for pkg in vibebms-macos-universal.app.zip vibeBMS.apk; do
            [ -f "out/$pkg" ] || continue
            while IFS= read -r f; do
              unzip -p "out/$pkg" "$f" > "$inner"
              add "$pkg/$f" "$inner"
            done < <(unzip -Z1 "out/$pkg" | grep -E '\.app/Contents/MacOS/vibebms$|^lib/[^/]+/libvibebms_android\.so$')
          done
          jq --arg version "$VERSION" --arg commit "$GITHUB_SHA" --argjson files "$files" \
            --arg channel "${VIBEBMS_CHANNEL:-nightly}" --argjson run "$GITHUB_RUN_NUMBER" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg since "$(date -u -d '90 days ago' +%Y-%m-%dT%H:%M:%SZ)" '
            def nightly: (.version // "-") | test("-");
            # a run done again replaces its entry; a run that built nothing adds none
            .builds
            | if $files == {} then . else
                [.[] | select(.version != $version)] + [{version: $version, channel: $channel, run: $run, commit: $commit, date: $date, files: $files}]
              end
            | ([.[] | select(nightly)] | length - 500) as $over
            | {v: 1, builds: (reduce .[] as $b ({n: 0, out: []};
                if ($b | nightly) then
                  .n += 1 | if .n > $over and $b.date >= $since then .out += [$b] else . end
                else .out += [$b] end) | .out)}
          ' prev/builds.json > out/builds.json
          jq -c '.builds[-1]' out/builds.json
          echo "sha256=$(sha256sum < out/builds.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # the F-Droid repository (tools/fdroid_repo.sh, docs/BUILDING.md): the
      # APK as uploaded, the only version, in an index signed with
      # FDROID_KEYSTORE (else ANDROID_KEYSTORE). Built here, so fdroid.txt
      # (address, fingerprint, link) goes up with the release; pushed to the
      # fdroid-repo branch once the release is published. Only an APK signed
      # with the repository's key goes in: one signed by a throwaway key could
      # not update the installed app. A failure here holds back nothing else:
      # the job's last step reports it, once the rest is published.
      # First fdroidserver, in a step that has no key: installing runs the
      # packages' code (four are built from their sources). Each file is
      # pinned by SHA-256 (tools/fdroidserver.txt), so the next step, which
      # has the key, runs what was there when the pins were made.
      # (the Python tools/fdroidserver.txt's files were chosen for: another
      # version takes other wheels, which no hash there covers)
      - if: env.RELEASE == 'true'
        continue-on-error: true
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: F-Droid tools
        id: fdroid-tools
        if: env.RELEASE == 'true'
        continue-on-error: true
        env:
          APK_SIGNING: ${{ needs.android-sign.outputs.signing }}
          HAVE_KEY: ${{ secrets.FDROID_KEYSTORE != '' || secrets.ANDROID_KEYSTORE != '' }}
        run: |
          skip() {
            echo "F-Droid repository not updated: $1"
            printf '### F-Droid repository\n\nNot updated: %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [ -f out/vibeBMS.apk ] || skip "this run built no APK (the repository keeps the previous one)."
          secrets="(docs/BUILDING.md, \"F-Droid repository\")"
          [ "$APK_SIGNING" = repository ] ||
            skip "the APK was signed with a throwaway key, so it could not update an installed one. Add the secrets \`ANDROID_KEYSTORE\` (the keystore, base64) and \`ANDROID_KEYSTORE_PASSWORD\` $secrets."
          # a key that stays: one made per run would change the fingerprint
          # the clients pinned
          [ "$HAVE_KEY" = true ] ||
            skip "no key to sign its index: add the secrets \`FDROID_KEYSTORE\` and \`FDROID_KEYSTORE_PASSWORD\`, or \`ANDROID_KEYSTORE\` and \`ANDROID_KEYSTORE_PASSWORD\` $secrets."
          python3 -m venv "$RUNNER_TEMP/fdroidserver"
          pip="$RUNNER_TEMP/fdroidserver/bin/pip"
          "$pip" install -q --require-hashes --only-binary :all: -r src/tools/fdroidserver-build.txt
          "$pip" install -q --require-hashes --no-build-isolation -r src/tools/fdroidserver.txt
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: F-Droid repository
        id: fdroid
        if: env.RELEASE == 'true' && steps.fdroid-tools.outputs.ready == 'true'
        continue-on-error: true
        env:
          # (the APK's key only when the repository has none of its own)
          KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE || secrets.ANDROID_KEYSTORE }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE && secrets.FDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          FDROID_REPO_URL: https://raw.githubusercontent.com/${{ github.repository }}/fdroid-repo/repo
        run: |
          export FDROID_KEYSTORE_FILE="$RUNNER_TEMP/fdroid.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$FDROID_KEYSTORE_FILE"
          # the index for older clients is signed with SHA1withRSA: an EC key (as the APK's may be)
          # would leave it unsigned
          if ! keytool -list -v -keystore "$FDROID_KEYSTORE_FILE" -storepass:env FDROID_KEYSTORE_PASS |
            grep -q '^Subject Public Key Algorithm: .*RSA'; then
            rm "$FDROID_KEYSTORE_FILE"
            why="its key is not an RSA key, which F-Droid's index needs: add the secrets \`FDROID_KEYSTORE\` and \`FDROID_KEYSTORE_PASSWORD\` with an RSA key (docs/BUILDING.md, \"F-Droid repository\")."
            echo "F-Droid repository not updated: $why"
            printf '### F-Droid repository\n\nNot updated: %s\n' "$why" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PATH="$RUNNER_TEMP/fdroidserver/bin:$PATH" src/tools/fdroid_repo.sh build out/vibeBMS.apk "$RUNNER_TEMP/fdroid"
          rm "$FDROID_KEYSTORE_FILE"
          # (their SHA-256 first: the check before the upload publishes them
          # only with these)
          echo "sha256-txt=$(sha256sum < "$RUNNER_TEMP/fdroid/fdroid.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha256-qr=$(sha256sum < "$RUNNER_TEMP/fdroid/fdroid-qr.png" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/fdroid/fdroid.txt" "$RUNNER_TEMP/fdroid/fdroid-qr.png" out/
          echo "built=true" >> "$GITHUB_OUTPUT"
      # the same check again, the last step before the upload: the steps since
      # the first check (builds.json, the F-Droid tools and repository: the
      # pinned fdroidserver's code) could have changed out/. The same text,
      # from the workflow, not a file the steps before could change
      - name: check the files again
        if: env.RELEASE == 'true'
        env: *check-files-env
        run: *check-files
      - name: release
        id: release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # only the branch's head is published: a newer push has its own run,
          # but for a commit that skips CI ([skip ci] and the like), which has
          # none, this commit stays the latest build
          moved_on() { [ "$(src/tools/ci_moved_on.sh "$SHA")" = yes ]; }
          if moved_on; then
            echo "$GITHUB_REF_NAME has moved on from ${SHA:0:7}; its own run publishes it"
            exit 0
          fi
          # the tag follows the latest commit
          if ! gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$SHA" -F force=true >/dev/null \
            && ! gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$SHA" >/dev/null; then
            moved_on && { echo "$GITHUB_REF_NAME moved on meanwhile"; exit 0; }
            exit 1
          fi
          notes="$(
            echo "The latest build of \`${GITHUB_REF_NAME}\`: version $VERSION ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            echo
            echo "Files from this commit: $(cd out && ls | sed 's/^/`/; s/$/`/' | paste -sd ' ')"
            echo
            echo "- macOS: \`vibeBMS-macos-universal.dmg\` has the app (Apple silicon and Intel): drag it to Applications."
            echo "  It is not notarized: open it the first time with right-click → Open, or in"
            echo "  System Settings → Privacy & Security → Open Anyway."
            echo "- Linux / macOS executables: \`chmod +x vibebms-*\`; on macOS also \`xattr -d com.apple.quarantine vibebms-*\`."
            echo "- Linux: \`vibebms-linux-*\` needs glibc 2.35 and WebKitGTK 4.1 (\`libwebkit2gtk-4.1-0\`, for the download browser);"
            echo "  \`vibebms-linux-*-portable\` has no download browser and starts with glibc 2.28 and ALSA."
            echo "- Linux Flatpak (x64, arm64): \`flatpak install --user vibeBMS-linux-x64.flatpak\` (or \`-arm64\`; it fetches the GNOME runtime from Flathub),"
            echo "  then start \"vibeBMS Nightly\" or \`flatpak run io.github.vibebms.nightly\`. It does not update itself: install a newer"
            echo "  bundle the same way. Its data is in \`~/.var/app/io.github.vibebms.nightly/data/vibeBMS\`."
            echo "- Android: \`vibeBMS.apk\`. For updates in F-Droid, Droid-ify or Neo Store, add the F-Droid repository"
            echo "  https://raw.githubusercontent.com/$GH_REPO/fdroid-repo/repo (its fingerprint and a link are in \`fdroid.txt\`)."
            echo "- iOS: the .ipa is unsigned (sideload it, e.g. with AltStore, SideStore or LiveContainer)."
            echo "  For updates in AltStore / SideStore, add the source https://github.com/$GH_REPO/releases/download/nightly/altstore.json"
            echo "- Web: unzip and serve the folder over HTTP(S), or use https://vibebms.github.io/vibe/."
          )"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly" --notes "$notes" --target "$SHA"
          else
            gh release create nightly --prerelease --title "Nightly" --notes "$notes" --target "$SHA"
          fi
          # the list last: a client reads latest.json and its signature
          # together, and an upload cut off leaves the previous list and
          # signature (which name the files before this run's), or this run's
          # signature beside the previous list (which then does not verify)
          others=()
          for f in out/*; do
            case "${f#out/}" in latest.json | latest.json.sig) ;; *) others+=("$f") ;; esac
          done
          gh release upload nightly "${others[@]}" --clobber
          [ ! -f out/latest.json.sig ] || gh release upload nightly out/latest.json.sig --clobber
          gh release upload nightly out/latest.json --clobber
          echo "published=true" >> "$GITHUB_OUTPUT"
      # the F-Droid repository's branch: one commit, replaced each time (the
      # older APKs are not kept). The release's concurrency group lets one run
      # at a time get here, and only the branch's head is published.
      - name: publish the F-Droid repository
        if: env.RELEASE == 'true' && steps.release.outputs.published == 'true' && steps.fdroid.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$(src/tools/ci_moved_on.sh "$SHA")" = yes ]; then
            echo "$GITHUB_REF_NAME has moved on from ${SHA:0:7}; its own run publishes it"
            exit 0
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          src/tools/fdroid_repo.sh push "$RUNNER_TEMP/fdroid" "https://github.com/$GH_REPO.git" fdroid-repo
          url="https://raw.githubusercontent.com/$GH_REPO/fdroid-repo/repo"
          fp="$(cat "$RUNNER_TEMP/fdroid/fingerprint")"
          {
            echo "### F-Droid repository"
            echo
            echo "Updated with $(cat "$RUNNER_TEMP/fdroid/app_id") $VERSION. Add it in F-Droid, Droid-ify or Neo Store:"
            echo
            echo "- address: $url"
            echo "- fingerprint (SHA-256): \`$fp\`"
            echo "- link (open it on the phone): \`fdroidrepos://${url#https://}?fingerprint=$fp\` or ${url}?fingerprint=$fp"
            echo
            echo "The release has these in \`fdroid.txt\` and the link as a QR code in \`fdroid-qr.png\`."
          } >> "$GITHUB_STEP_SUMMARY"
      # (a red run: the release would else lack fdroid.txt, and the
      # repository stay at an older APK, with nobody told)
      - name: F-Droid repository failed
        if: env.RELEASE == 'true' && (steps.fdroid-tools.outcome == 'failure' || steps.fdroid.outcome == 'failure')
        run: |
          printf '### F-Droid repository\n\nNot updated: building it failed (see the steps "F-Droid tools" and "F-Droid repository").\n' >> "$GITHUB_STEP_SUMMARY"
          echo "::error::the F-Droid repository was not updated (the steps \"F-Droid tools\" and \"F-Droid repository\"); the rest of the release is published"
          exit 1

  # links to the executables in the run summary, once the builds are done
