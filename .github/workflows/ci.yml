name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (lint + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, os: windows-latest, target: aarch64-pc-windows-msvc }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release -p vibebms --target ${{ matrix.target }}
      # the executable alone (the downloads job links it in the run summary)
      - uses: actions/upload-artifact@v4
        with:
          name: vibeBMS-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/vibebms
            target/${{ matrix.target }}/release/vibebms.exe

  web:
    name: build web (wasm32)
    needs: test
    runs-on: ubuntu-latest
    # pushes publish the build to the gh-pages branch (GitHub Pages)
    permissions:
      contents: write
    concurrency:
      group: web-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install wasm-bindgen-cli --locked --version "$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | cut -d'"' -f2)"
      - run: ./tools/build_web.sh
      # table servers send no CORS headers: the page reads copies next to it
      - name: difficulty tables
        run: python3 tools/snapshot_tables.py web || echo "::warning::no table could be copied"
      # the web build has no system fonts: Japanese / Korean titles need these
      - name: CJK fonts (Noto Sans CJK, SIL OFL 1.1)
        run: |
          base=https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans
          curl -fsSL -o web/fonts/NotoSansJP-Regular.otf "$base/SubsetOTF/JP/NotoSansJP-Regular.otf"
          curl -fsSL -o web/fonts/NotoSansKR-Regular.otf "$base/SubsetOTF/KR/NotoSansKR-Regular.otf"
          curl -fsSL -o web/fonts/NotoSansCJK-LICENSE.txt "$base/LICENSE"
          printf "NotoSansJP-Regular.otf\nNotoSansKR-Regular.otf\n" >> web/fonts/fonts.txt
      - name: demo song (the page's "Demo song" button)
        run: |
          python3 tools/gen_demo.py "$RUNNER_TEMP/demo/vibeBMS demo"
          (cd "$RUNNER_TEMP/demo" && zip -qr "$GITHUB_WORKSPACE/web/demo.zip" "vibeBMS demo")
      - uses: actions/upload-artifact@v4
        with:
          name: vibeBMS-web
          path: web
      # default branch -> the site root, other branches -> preview/<branch>/
      - name: where to publish
        if: github.event_name == 'push'
        id: dest
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "${{ github.event.repository.default_branch }}" ]; then
            dir=""
          else
            dir="preview/$(echo "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._\n-' '-')"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "url=https://${owner}.github.io/${repo}/${dir:+$dir/}" >> "$GITHUB_OUTPUT"
      - name: publish to gh-pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          destination_dir: ${{ steps.dest.outputs.dir }}
          keep_files: true
          commit_message: "web build ${{ github.sha }} (${{ github.ref_name }})"
      - name: link
        if: github.event_name == 'push'
        run: |
          echo "### Web build" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.dest.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "(needs GitHub Pages: Settings > Pages > Deploy from a branch > gh-pages / root)" >> "$GITHUB_STEP_SUMMARY"

  # an unsigned .ipa: install it by signing it with your own Apple ID
  # (AltStore, Sideloadly) or a developer certificate
  ios:
    name: build iOS (unsigned, experimental)
    needs: test
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: aarch64-apple-ios
      - run: cargo build --release -p vibebms --target aarch64-apple-ios
      - name: package
        run: |
          app=Payload/vibeBMS.app
          mkdir -p "$app"
          cp target/aarch64-apple-ios/release/vibebms "$app/"
          cp platform/ios/Info.plist platform/ios/*.png "$app/"
          zip -qr vibeBMS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: vibeBMS-ios-unsigned
          path: vibeBMS-unsigned.ipa

  # the app in the iOS simulator: it starts, and its download browser saves
  # and unpacks a zip; screenshots and the log are uploaded
  ios-simulator:
    name: iOS simulator (smoke test)
    needs: test
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: aarch64-apple-ios-sim
      - run: cargo build --release -p vibebms --target aarch64-apple-ios-sim
      - name: app bundle
        run: |
          app="$RUNNER_TEMP/vibeBMS.app"
          mkdir -p "$app"
          cp target/aarch64-apple-ios-sim/release/vibebms "$app/"
          cp platform/ios/Info.plist platform/ios/*.png "$app/"
          plutil -replace CFBundleSupportedPlatforms -json '["iPhoneSimulator"]' "$app/Info.plist"
          codesign --force --sign - "$app"
          echo "APP=$app" >> "$GITHUB_ENV"
      - name: run in the simulator
        run: |
          # the newest iOS runtime and an iPad it supports
          rt=$(xcrun simctl list runtimes -j | jq '[.runtimes[] | select(.isAvailable and .platform == "iOS")] | last')
          runtime=$(echo "$rt" | jq -r .identifier)
          dtype=$(echo "$rt" | jq -r '[.supportedDeviceTypes[] | select(.productFamily == "iPad")] | last | .identifier')
          echo "runtime $runtime, device $dtype"
          udid=$(xcrun simctl create vibe "$dtype" "$runtime")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$APP"
          mkdir -p sim
          # 1: it starts and shows the music select
          xcrun simctl launch --stderr="$PWD/sim/start.log" "$udid" io.github.vibebms
          sleep 45
          xcrun simctl io "$udid" screenshot sim/1-start.png
          xcrun simctl terminate "$udid" io.github.vibebms || true
          sleep 2
          # 2: the download browser on a zip (this repository's)
          SIMCTL_CHILD_VIBEBMS_TEST_BROWSE="https://codeload.github.com/${{ github.repository }}/zip/${{ github.sha }}" \
            xcrun simctl launch --stderr="$PWD/sim/browse.log" "$udid" io.github.vibebms
          sleep 25
          xcrun simctl io "$udid" screenshot sim/2-browser.png
          sleep 50
          xcrun simctl io "$udid" screenshot sim/3-after.png
          xcrun simctl terminate "$udid" io.github.vibebms || true
          grep -E "Library:|Downloading|Added|failed|panicked|error" sim/start.log sim/browse.log || true
          grep -q "Library:" sim/start.log || { echo "::error::the app did not start"; exit 1; }
          grep -q "Added " sim/browse.log || echo "::warning::the browser did not download and unpack the zip"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibeBMS-ios-simulator
          path: sim

  android:
    name: build android (experimental)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: cargo install cargo-ndk --locked
      # the Rust library into the Gradle project, then the APK
      - run: >-
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t x86_64 -o platform/android/app/jniLibs
          build --release -p vibebms-android
      # cargo-ndk copies every cdylib it built; only ours is loaded
      - run: find platform/android/app/jniLibs -name '*.so' ! -name libvibebms_android.so -delete
      # release APKs must be signed: with the repository's key when its
      # secrets hold one (base64 keystore + password), else a throwaway key
      # (the APK installs, but cannot update one signed by another key)
      - name: signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            pass="$KEYSTORE_PASSWORD"
          else
            pass="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$ks" -storepass "$pass" -keypass "$pass" -alias vibebms \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=vibeBMS"
          fi
          echo "::add-mask::$pass"
          # the key's alias (a keystore made for cargo-apk has one key)
          alias="$(keytool -list -keystore "$ks" -storepass "$pass" | grep -m1 PrivateKeyEntry | cut -d, -f1)"
          echo "VIBEBMS_KEYSTORE=$ks" >> "$GITHUB_ENV"
          echo "VIBEBMS_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"
          echo "VIBEBMS_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle -p platform/android --no-daemon assembleRelease
      - run: cp platform/android/app/build/outputs/apk/release/app-release.apk vibeBMS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vibeBMS-android
          path: vibeBMS.apk

  # links to the executables in the run summary, once the builds are done
  downloads:
    name: downloads
    needs: [build, android, ios]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: links
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Downloads"
            echo
            echo "| build | |"
            echo "|---|---|"
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate \
              --jq '.artifacts[] | select(.name | test("^vibeBMS-(linux|windows|macos|android|ios-unsigned)")) | "\(.name)\t\(.id)\t\(.size_in_bytes)"' |
              sort | while IFS=$'\t' read -r name id size; do
                echo "| ${name#vibeBMS-} | [download]($RUN/artifacts/$id) ($((size / 1048576)) MB) |"
              done
            echo
            echo "Linux / macOS: \`chmod +x vibebms\` after unzipping; on macOS also \`xattr -d com.apple.quarantine vibebms\`."
          } >> "$GITHUB_STEP_SUMMARY"
