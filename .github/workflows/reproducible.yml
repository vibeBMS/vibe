# Rebuilds a commit's release builds twice, independently, and checks that
# each gives the same bytes both times and the same as the nightly release
# (docs/BUILDING.md, "Reproducible builds"). Run it from Actions > Reproducible
# builds > Run workflow.
#
# The two builds of each artifact (a and b) differ in what must not matter: the
# folder (a: the workspace; b: another, deeper one), CARGO_HOME, the number of
# parallel jobs, the umask and, for the container builds, the folder and home
# in the container (and for the portable and web builds the runner image). The
# container builds (the Linux executables, the web build) run
# tools/reproduce.sh, as anyone would; the Flatpaks are packaged from them on
# Ubuntu 22.04, as CI packages them. The others build with
# tools/build_release.sh on the runner image the commit's tools/repro.env
# names, with its Xcode or MSVC toolset and Windows SDK; the macOS app is
# packaged by tools/package_macos.sh. A difference fails the run and
# diffoscope's report of it is attached.
#
# Against the release: builds.json has the executables' hashes of every
# nightly of the last 90 days (the macOS app's executable too); the release's
# own files (the web zip, the Flatpaks, the macOS app's zip, the .ipa) are
# compared while the nightly release is still the commit's. The APK is signed
# (here with a throwaway debug key) and the .dmg is not reproducible (hdiutil
# writes times and IDs), so the files in them are compared (the files of the
# app's zip and of the .ipa are listed too, to show which one differs); the
# Android library is in builds.json.
name: Reproducible builds

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel
        type: choice
        default: nightly
        options:
          - nightly
      commit:
        description: "Commit (default: the channel's newest build)"
        required: false
        default: ""
      run:
        description: "CI run number, only for a build builds.json no longer has (default: from builds.json)"
        required: false
        default: ""
      linux-portable:
        description: Linux portable executables (x64, arm64)
        type: boolean
        default: true
      web:
        description: Web build
        type: boolean
        default: true
      linux:
        description: Linux executables and Flatpaks (x64, arm64)
        type: boolean
        default: false
      windows:
        description: Windows (x64, arm64)
        type: boolean
        default: false
      macos:
        description: macOS app
        type: boolean
        default: false
      ios:
        description: iOS app
        type: boolean
        default: false
      android:
        description: Android APK
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: which commit and builds
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      run: ${{ steps.plan.outputs.run }}
      matrix: ${{ steps.plan.outputs.matrix }}
      artifacts: ${{ steps.plan.outputs.artifacts }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT: ${{ inputs.commit }}
          RUN: ${{ inputs.run }}
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          # builds.json (in the nightly release) lists the builds of every
          # channel: their commit and run (older entries: only the version,
          # <version>-<channel>.<run>+<commit>; a stable one is the plain version)
          gh release download nightly -p builds.json -D prev
          builds="$(jq -c --arg ch "$CHANNEL" '[.builds[]
            | . + {channel: (.channel // ((.version | capture("^[^-]*-(?<c>[a-z]+)\\.").c) // "stable")),
                   run: (.run // ((.version | capture("^[^-]*-[a-z]+\\.(?<r>[0-9]+)\\+").r | tonumber) // null))}
            | select(.channel == $ch)]' prev/builds.json)"
          if [ -z "$COMMIT" ]; then
            COMMIT="$(jq -r 'last | .commit // empty' <<< "$builds")"
            [ -n "$COMMIT" ] || { echo "::error::builds.json has no $CHANNEL build: give a commit"; exit 1; }
          fi
          commit="$(gh api "repos/$GH_REPO/commits/$COMMIT" --jq .sha)"
          if [ -z "$RUN" ]; then
            RUN="$(jq -r --arg c "$commit" '[.[] | select(.commit == $c)] | last | .run // empty' <<< "$builds")"
            [ -n "$RUN" ] || { echo "::error::builds.json has no $CHANNEL build of $commit: give its run number"; exit 1; }
          fi
          [[ "$RUN" =~ ^[0-9]+$ ]] || { echo "::error::the run number is not a number: $RUN"; exit 1; }
          # the boxes ticked
          list="$(jq -r '{
              "linux-portable": "linux-x64-portable linux-arm64-portable",
              "web": "web",
              "linux": "linux-x64 linux-arm64",
              "windows": "windows-x64 windows-arm64",
              "macos": "macos", "ios": "ios", "android": "android"
            } as $box | [to_entries[] | select(.value == true and $box[.key]) | $box[.key]] | join(" ")' <<< "$INPUTS")"
          [ -n "$list" ] || { echo "::error::nothing to rebuild: tick at least one box"; exit 1; }
          # the runner images the commit was built on (its tools/repro.env;
          # older commits: the labels CI used then, and the WebKitGTK builds
          # on the Ubuntu 22.04 image rather than in a container)
          gh api "repos/$GH_REPO/contents/tools/repro.env?ref=$commit" -H "Accept: application/vnd.github.raw" > repro.env ||
            { echo "::error::$commit has no tools/repro.env"; exit 1; }
          pin() { sed -n "s/^$1=\"\{0,1\}\([^\"]*\)\"\{0,1\}$/\1/p" repro.env; }
          mac="$(pin MACOS_RUNNER)" win="$(pin WINDOWS_RUNNER)" linux=container
          [ -n "$(pin LINUX_IMAGE_X64)" ] || linux=runner
          # each artifact twice; the portable and web builds on two runner images
          matrix="$(jq -cn --arg list "$list" --arg mac "${mac:-macos-latest}" --arg win "${win:-windows-latest}" \
            --arg linux "$linux" '
            {
              "linux-x64-portable": {kind: "container", a: "ubuntu-latest", b: "ubuntu-24.04", targets: "x86_64-unknown-linux-gnu"},
              "linux-arm64-portable": {kind: "container", a: "ubuntu-24.04-arm", b: "ubuntu-22.04-arm", targets: "aarch64-unknown-linux-gnu"},
              "web": {kind: "container", a: "ubuntu-latest", b: "ubuntu-24.04", targets: "wasm32-unknown-unknown"},
              "linux-x64": {kind: $linux, a: "ubuntu-22.04", b: "ubuntu-22.04", targets: "x86_64-unknown-linux-gnu"},
              "linux-arm64": {kind: $linux, a: "ubuntu-22.04-arm", b: "ubuntu-22.04-arm", targets: "aarch64-unknown-linux-gnu"},
              "windows-x64": {kind: "runner", a: $win, b: $win, targets: "x86_64-pc-windows-msvc"},
              "windows-arm64": {kind: "runner", a: $win, b: $win, targets: "aarch64-pc-windows-msvc"},
              "macos": {kind: "runner", a: $mac, b: $mac, targets: "aarch64-apple-darwin x86_64-apple-darwin"},
              "ios": {kind: "runner", a: $mac, b: $mac, targets: "aarch64-apple-ios"},
              "android": {kind: "runner", a: "ubuntu-latest", b: "ubuntu-latest", targets: "aarch64-linux-android x86_64-linux-android"}
            } as $all
            | [$list | split(" ")[] as $n | ["a", "b"][] as $v
               | {artifact: $n, variant: $v, kind: $all[$n].kind, os: $all[$n][$v], targets: $all[$n].targets}]')"
          {
            echo "commit=$commit"
            echo "run=$RUN"
            echo "matrix=$matrix"
            echo "artifacts=$list"
          } >> "$GITHUB_OUTPUT"
          echo "rebuilding $list of $commit, run $RUN"

  build:
    name: ${{ matrix.artifact }} (${{ matrix.variant }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      RUN: ${{ needs.plan.outputs.run }}
      VIBEBMS_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
          path: src
          persist-credentials: false
      - name: where it builds
        run: |
          [ -x src/tools/build_release.sh ] ||
            { echo "::error::$COMMIT predates reproducible builds (no tools/build_release.sh)"; exit 1; }
          # (on Windows as C:/x/y, which both bash and the runner take)
          native() { if command -v cygpath >/dev/null; then cygpath -m "$1"; else printf %s "$1"; fi; }
          if [ "${{ matrix.variant }}" = a ]; then
            dir="$(native "$GITHUB_WORKSPACE/src")"
          else
            # another folder, CARGO_HOME, umask and fewer parallel jobs
            dir="$(native "$RUNNER_TEMP/elsewhere/deeper/vibe-b")"
            mkdir -p "$(dirname "$dir")"
            cp -a src "$dir"
            cargo_home="$(native "$RUNNER_TEMP/cargo-b")"
            {
              echo "CARGO_HOME=$cargo_home"
              echo "CARGO_BUILD_JOBS=2"
              echo "UMASK=0002"
              # the container builds: the folder and home in the container
              echo "REPRO_PATH=/build/elsewhere/src"
              echo "REPRO_HOME=/opt/rebuild"
              echo "REPRO_JOBS=2"
            } >> "$GITHUB_ENV"
            echo "$cargo_home/bin" >> "$GITHUB_PATH"
          fi
          echo "DIR=$dir" >> "$GITHUB_ENV"
          echo "OUT=$(native "$GITHUB_WORKSPACE/out")" >> "$GITHUB_ENV"

      # --- in a container: tools/reproduce.sh ---
      - name: rebuild (tools/reproduce.sh)
        if: matrix.kind == 'container'
        env:
          VIBEBMS_THIRD_PARTY: ${{ vars.WEB_THIRD_PARTY }}
          REPRO_COMPARE: "0"
        run: |
          umask "${UMASK:-0022}"
          REPRO_OUT="$OUT" "$DIR/tools/reproduce.sh" "$COMMIT" "$RUN" "$VIBEBMS_CHANNEL" "${{ matrix.artifact }}"

      # --- on the runner, as CI builds it ---
      # (the Flatpak's tools; a commit that built the executable on the
      # runner image: its libraries too)
      - name: packages (Linux)
        if: matrix.artifact == 'linux-x64' || matrix.artifact == 'linux-arm64'
        run: |
          sudo apt-get update
          if [ "${{ matrix.kind }}" = runner ]; then
            sudo apt-get install -y libasound2-dev libudev-dev libwebkit2gtk-4.1-dev
          fi
          sudo apt-get install -y --no-install-recommends flatpak desktop-file-utils appstream appstream-compose faketime
      - name: Rust (rust-toolchain.toml)
        if: matrix.kind == 'runner'
        working-directory: ${{ env.DIR }}
        run: |
          channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          targets=()
          for t in ${{ matrix.targets }}; do targets+=(--target "$t"); done
          rustup toolchain install "$channel" --profile minimal "${targets[@]}"
      - if: matrix.artifact == 'android'
        uses: ./src/.github/actions/android-setup
        with:
          path: ${{ env.DIR }}
      - name: rebuild (tools/build_release.sh)
        if: matrix.kind == 'runner'
        working-directory: ${{ env.DIR }}
        run: |
          umask "${UMASK:-0022}"
          eval "$(GITHUB_ENV="" tools/ci_version.sh "$RUN" "$COMMIT")"
          tools/build_release.sh "${{ matrix.artifact }}" "$OUT"
          sha() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          # the macOS app, as CI packages it: its zip, and the files in the
          # zip and in the .dmg (the .dmg itself is not reproducible)
          if [ "${{ matrix.artifact }}" = macos ]; then
            pkg="$RUNNER_TEMP/macos"
            tools/package_macos.sh "$OUT/vibebms-macos-arm64" "$OUT/vibebms-macos-x64" "$pkg"
            cp "$pkg/vibebms-macos-universal.app.zip" "$OUT/"
            (
              cd "$OUT"
              sha vibebms-macos-universal.app.zip
              "$DIR/tools/build_release.sh" entries vibebms-macos-universal.app.zip
              "$DIR/tools/build_release.sh" entries "$pkg/vibeBMS-macos-universal.dmg"
            ) >> "$OUT/SHA256SUMS"
          fi

      # the Flatpak of the executable, as CI packages it (on Ubuntu 22.04)
      - name: the Flatpak
        if: matrix.artifact == 'linux-x64' || matrix.artifact == 'linux-arm64'
        working-directory: ${{ env.DIR }}
        run: |
          umask "${UMASK:-0022}"
          eval "$(GITHUB_ENV="" tools/ci_version.sh "$RUN" "$COMMIT")"
          a="${{ matrix.artifact }}"
          tools/package_flatpak.sh "$OUT/vibebms-$a" "$RUNNER_TEMP/flatpak"
          cp "$RUNNER_TEMP/flatpak/vibeBMS-$a.flatpak" "$OUT/"
          (cd "$OUT" && sha256sum "vibeBMS-$a.flatpak" >> SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: repro-${{ matrix.artifact }}-${{ matrix.variant }}
          path: out
          retention-days: 7

  compare:
    name: compare
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
          path: src
          persist-credentials: false
          sparse-checkout: |
            tools
            Cargo.toml
      - uses: actions/download-artifact@v8
        with:
          pattern: repro-*
          path: art
      - name: a against b, and against the release
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          REPRO_REPO: ${{ github.repository }}
          ARTIFACTS: ${{ needs.plan.outputs.artifacts }}
        run: |
          export LC_ALL=C
          fail=0
          : > differ.txt
          {
            echo "### Reproducible builds"
            echo
            echo "\`${{ needs.plan.outputs.commit }}\`, run ${{ needs.plan.outputs.run }} (${{ inputs.channel }})"
            echo
            echo "| artifact | a = b | release | built with |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for x in $ARTIFACTS; do
            a="art/repro-$x-a" b="art/repro-$x-b"
            if [ ! -f "$a/SHA256SUMS" ] || [ ! -f "$b/SHA256SUMS" ]; then
              echo "| $x | a build failed | | |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
              continue
            fi
            # the files whose hash differs or that only one build has ("<sha256>
            # <name>", names may have spaces; an APK is signed by each build's
            # own debug key: its files are compared)
            awk -v x="$x" '
              /\.apk$/ { next }
              { h = substr($0, 1, 64); n = substr($0, 67) }
              NR == FNR { a[n] = h; next }
              { if (a[n] != h) print x "\t" n; delete a[n] }
              END { for (n in a) print x "\t" n }
            ' "$a/SHA256SUMS" "$b/SHA256SUMS" | sort > this.txt
            if [ -s this.txt ]; then
              same="**differ**"
              fail=1
              cat this.txt >> differ.txt
            else
              same="same"
            fi
            # what it was built with (build.txt: Rust, the C toolchain, the image)
            with="$(sed -n 's/^\(rustc\|toolchain\|image\)=//p' "$a/build.txt" | sed 's/|/\\|/g' | paste -sd ';' - | sed 's/;/; /g')"
            echo "== $x against the release"
            if src/tools/reproduce.sh compare "$a" | tee compare.txt; then
              if grep -q 'same as the release' compare.txt; then rel="same"; else rel="not published"; fi
            else
              rel="**differs**"
              fail=1
            fi
            echo "| $x | $same | $rel | $with |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          [ -s differ.txt ] && echo "differ=true" >> "$GITHUB_OUTPUT"
          cat differ.txt
      - name: diffoscope (what differs)
        if: steps.compare.outputs.differ == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends diffoscope-minimal
          mkdir -p diffoscope
          while IFS=$'\t' read -r x f; do
            a="art/repro-$x-a/$f" b="art/repro-$x-b/$f"
            case "$f" in
              *.dmg/*) # (not uploaded: the app's zip has the same files)
                printf '\n#### %s: %s\nIn the .dmg: see the same file in the app zip.\n' "$x" "$f" >> "$GITHUB_STEP_SUMMARY"
                continue
                ;;
              */*) # a file in an APK (signed by different keys) or a zip: that file
                pkg="${f%%/*}" inner="${f#*/}"
                mkdir -p "inner/a" "inner/b"
                a="inner/a/$(basename "$inner")" b="inner/b/$(basename "$inner")"
                unzip -p "art/repro-$x-a/$pkg" "$inner" > "$a" || true
                unzip -p "art/repro-$x-b/$pkg" "$inner" > "$b" || true
                ;;
            esac
            report="diffoscope/$x-$(basename "$f").txt"
            timeout 1200 diffoscope --text "$report" --max-report-size 20000000 "$a" "$b" || true
            {
              echo
              echo "#### $x: $f"
              echo '```'
              head -c 30000 "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done < differ.txt
      - if: steps.compare.outputs.differ == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: diffoscope
          path: diffoscope
      - if: steps.compare.outputs.fail != '0'
        run: |
          echo "::error::the builds are not reproducible (see the summary)"
          exit 1
