# Weekly dependency updates. Minor and patch releases of each ecosystem come
# as one grouped pull request; a major release gets its own. A release is
# taken once it is 7 days old (cooldown): the merge workflow merges what
# passes CI with no person looking, and one that is withdrawn or reported in
# its first week then never arrives. (Security updates do not wait.)
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
      # (the project's own repository: its commits do not wait)
      exclude: ["bmseeker"]
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: [minor, patch]

  # rust-toolchain.toml's release: it changes the release builds' bytes, so
  # it moves in a commit of its own, merged like a minor update once CI passes
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # v6 moved its caching into a proprietary component under Gradle's
      # Terms of Use (accepted by upgrading). Unblock: agree to those terms,
      # or move with `cache-disabled: true` (then the component is not used).
      - dependency-name: "gradle/actions"
        versions: [">= 6"]

  - package-ecosystem: gradle
    directory: /platform/android
    schedule:
      interval: monthly
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    groups:
      gradle:
        patterns: ["*"]
