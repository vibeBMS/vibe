# Weekly dependency updates. Minor and patch releases of each ecosystem come
# as one grouped pull request; a major release gets its own.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    ignore:
      # vendor/lua-src is a copy of it (its sources compiled in name order,
      # for reproducible builds): a new release is taken there by hand
      - dependency-name: "lua-src"
    groups:
      cargo:
        update-types: [minor, patch]

  # rust-toolchain.toml's release: it changes the release builds' bytes, so
  # it moves in a commit of its own, merged like a minor update once CI passes
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # v6 moved its caching into a proprietary component under Gradle's
      # Terms of Use (accepted by upgrading). Unblock: agree to those terms,
      # or move with `cache-disabled: true` (then the component is not used).
      - dependency-name: "gradle/actions"
        versions: [">= 6"]

  - package-ecosystem: gradle
    directory: /platform/android
    schedule:
      interval: monthly
      timezone: Asia/Seoul
    groups:
      gradle:
        patterns: ["*"]
